[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chto-za-vino-account"
version = "0.1.0"
description = "Account service of «Винный дневник»: login by email code and Yandex ID, messenger linking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0.0,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
chto-za-vino-account = "chto_za_vino_account.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chto_za_vino_account"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# The HTML of the code email is one inline-styled line per element.
"src/chto_za_vino_account/mailer.py" = ["E501"]
