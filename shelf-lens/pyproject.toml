[project]
name = "shelf-reid"
version = "0.1.0"
description = "Find the unique bottles of a shelf over several photos or video frames"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "requests>=2.31",
]

[project.scripts]
shelfreid = "shelfreid.cli:main"

[project.optional-dependencies]
deep = [
    "lightglue",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
detect = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxslim>=0.1.98",
    "pycocotools>=2.0.11",
    "rfdetr>=1.11.2",
    "transformers>=5.20.1",
    "ultralytics>=8.4.182",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelfreid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue" }
