name: svoe-vino-lab-max-bot-host-demo

services:
  host-demo:
    build:
      # The image needs the shared core: the context is the repository root.
      context: ..
      dockerfile: max-bot/Dockerfile
    command: ["chto-za-vino-max-host-demo"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
