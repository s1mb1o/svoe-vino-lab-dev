name: Matcher tests

on:
  push:
    branches:
      - main
    paths:
      - "matcher/**"
      - ".github/workflows/matcher-tests.yml"
  pull_request:
    paths:
      - "matcher/**"
      - ".github/workflows/matcher-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matcher-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matcher-tests:
    runs-on: [self-hosted, Linux, X64, svoe-vino-lab]
    timeout-minutes: 15
    steps:
      - name: Check out matcher
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: matcher

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: matcher/requirements.txt

      - name: Verify shell harness tools
        shell: bash
        run: |
          set -euo pipefail
          for command_name in bash curl jq awk mktemp; do
            command -v "$command_name"
          done
          command -v sha256sum >/dev/null || command -v shasum >/dev/null

      - name: Install matcher dependencies
        run: |
          python -m pip install --disable-pip-version-check -r matcher/requirements.txt
          python -m pip check

      - name: Run every matcher test without skips
        shell: bash
        run: |
          python -W error::ResourceWarning - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("matcher/tests")
          discovered = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(
              "matcher tests: discovered=%d run=%d skipped=%d"
              % (discovered, result.testsRun, len(result.skipped))
          )
          if not result.wasSuccessful():
              sys.exit(1)
          if result.testsRun != discovered:
              sys.exit("not every discovered matcher test ran")
          if result.skipped:
              sys.exit("matcher tests were skipped")
          PY
