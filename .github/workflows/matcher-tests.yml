name: Matcher tests

on:
  push:
    branches:
      - main
    paths:
      - "matcher/**"
      - ".github/workflows/matcher-tests.yml"
  pull_request:
    paths:
      - "matcher/**"
      - ".github/workflows/matcher-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matcher-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matcher-tests:
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 15
    steps:
      - name: Check out matcher
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: matcher

      - name: Pull the Python test image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull python:3.11-slim; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1

      - name: Run every matcher test without skips
        shell: bash
        run: |
          docker run --rm \
            --env PIP_DISABLE_PIP_VERSION_CHECK=1 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONUNBUFFERED=1 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            python:3.11-slim bash matcher/tests/run_ci.sh
