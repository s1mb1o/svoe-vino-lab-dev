# Configuration of the svoe-vino testset builder.
# The scripts read this file through `scripts/common.py`.
#
# The file holds two parts. The keys at the top are the same for every dataset.
# The key `dataset` holds one entry per photo set, and each entry holds the files
# and the directories of that photo set alone.
#
# `scripts/review_server.py` and `scripts/match_run.py` take `--dataset <name>`.
# Without that option they use the dataset named `default`. Every other script
# uses `default` too.

# Root directory of the workspace.
# Every relative path in this file is resolved against this directory.
# An absolute path in this file stays as it is.
rootdir: /Volumes/T7_2TB/Projects-T7_2TB/drink-atlas-workspace

# Database file of the vino-svoe.ru wines.
database_file: svoe-vino-lab/workbench/data/lab.sqlite3

# The Python interpreter that the lab server uses to start an embedding build. The venv
# holds the packages of requirements-local.txt, `torch` too. Read
# docs/plans/10_embeddings-page.md.
embedding_python: ~/.venvs/svoe-vino-lab/bin/python

# true: before each run of a pipeline of the backend `embedding`, the run updates the index
# of the embedding that the key `embedding` of the pipeline names. The build does only the
# items that are stale, missing, or failed, as the button `Build` of `/embedding` does, so
# a build with no change takes a few seconds. Its output goes to the end of
# `data/embeddings/<name>/build.log`, and `/embedding` shows its progress. A build that
# fails or stops makes the run fail. An embedding with no index gets no build: build it on
# `/embedding` first. `pipeline/run_job.py` (the button `Run>`) and
# `pipeline/embedding_run.py` read this key; a missing key is false. Read
# docs/plans/59_rebuild-embeddings-on-run.md (owner messages of 2026-09-27T08:40:19+0300
# and 08:40:26).
rebuild_embeddings_on_run: true

# The SAM3 service. `pipeline/derive.py` reads `endpoint` from this file when a module
# imports it; each SAM3 call of `pipeline/` and the default of each option `--sam3` use
# the value. The option `--config` of a script does not change it. Without the key, the
# service of gx10 below stays. The model cache (`data/cache/sam3/`) keys each answer on
# this URL too: a new URL asks SAM3 again for each image. A run keeps the URL of its
# own time in `run.json`.
sam3:
  endpoint: http://192.168.86.14:18081/upstream/sam3

# The embeddings of the Embeddings page. One entry: a name, an endpoint, options, and
# the steps of each view. `pipeline/build_embeddings.py --name <name>` builds one entry
# into `data/embeddings/<name>/`.
#
# `backend: openai` sends `POST <base_url>/embeddings`. `extra_body` goes into the body of
# each request. `backend: local` runs a Hugging Face model on this machine; `extra_body`
# goes to the image processor.
#
# The views of each entry: `full` is variant C (segment the package, remove the
# background, put it on white); `label` is variant F (the same for the label). A label
# close-up goes to the view `label` as it is. The entries are the image embedding models
# of gx10 on the screenshot of the owner of 2026-09-25.
embeddings:
  - name: gx10-siglip2-so400m-patch16-naflex-p256
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: siglip2-so400m-patch16-naflex
    extra_body:
      max_num_patches: 256
    views: &views_c_f
      full:
        steps:
          - step: segment
            target: package
          - step: remove_background
          - step: white_background
          - step: resize
            max_size: 1024
            aspect: keep
      label:
        steps:
          - step: segment
            target: label
          - step: remove_background
          - step: white_background
          - step: resize
            max_size: 1024
            aspect: keep

  - name: gx10-siglip2-so400m-patch16-naflex-p512
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: siglip2-so400m-patch16-naflex
    extra_body:
      max_num_patches: 512
    views: *views_c_f

  # Owner message of 2026-09-26T20:35+0300: NaFlex with 1,024 patches, the patch count of
  # `gx10-siglip2-so400m-patch16-512` (32 x 32), but with the native aspect ratio.
  - name: gx10-siglip2-so400m-patch16-naflex-p1024
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: siglip2-so400m-patch16-naflex
    extra_body:
      max_num_patches: 1024
    views: *views_c_f

  - name: gx10-siglip2-so400m-patch14-384
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: siglip2-so400m-patch14-384
    views: *views_c_f

  - name: gx10-siglip2-so400m-patch16-256
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: siglip2-so400m-patch16-256
    views: *views_c_f

  - name: gx10-siglip2-so400m-patch16-384
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: siglip2-so400m-patch16-384
    views: *views_c_f

  - name: gx10-siglip2-so400m-patch16-512
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: siglip2-so400m-patch16-512
    views: *views_c_f

  - name: gx10-naflexvit-so400m-patch16-siglip2-p256
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: naflexvit_so400m_patch16_siglip.v2_webli
    extra_body:
      max_num_patches: 256
    views: *views_c_f

  - name: gx10-pe-core-l14-336
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: PE-Core-L14-336
    views: *views_c_f

  - name: gx10-dinov3-vitb16
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: dinov3-vitb16-pretrain-lvd1689m
    views: *views_c_f

  - name: gx10-dinov3-vitl16
    backend: openai
    base_url: http://192.168.86.14:18081/v1
    model: dinov3-vitl16-pretrain-lvd1689m
    views: *views_c_f

  - name: local-siglip2-so400m-patch16-naflex-p256
    backend: local
    model: google/siglip2-so400m-patch16-naflex
    extra_body:
      max_num_patches: 256
    views: *views_c_f

# The clusters of the Clusters page (`/clusters`). The values apply to every entry of
# `embeddings`. `pipeline/clusters.py` reads this key; a missing key takes the value that
# is shown here. Read docs/plans/30_embedding-clusters.md, decisions D6 and D6a.
# A wine pair is a link when the cosine of one pair of their images is at or above the
# threshold of its space: `full_threshold` for the package images, `label_threshold` for
# the label images. The page has no threshold input; the button "Build clusters" and
# `pipeline/build_clusters.py` use these values.
# A build stores no cluster with fewer than `min_cluster_size` wines; the page has no
# input for it. A build stops, and keeps the old clusters.json, when one space has more
# than `max_links` links or one cluster has more than `max_cluster_size` wines.
clusters:
  full_threshold: 0.95
  label_threshold: 0.95
  min_cluster_size: 2
  max_links: 20000
  max_cluster_size: 50

# The label rules of the clusters: `pipeline/build_label_rules.py --name <embedding>`
# writes them into `data/embeddings/<name>/cluster-rules.json`, for the clusters of the
# view `combined`. Read docs/plans/45_cluster-label-rules.md. `pipeline/label_rules.py`
# reads this key; a missing key takes the value that is shown here. An unknown key stops
# the command. The name is not `cluster_rules`: `scripts/cluster_rules.py` reads that key.
#
# Stage 1 describes the label of each card: one call for each card, with the package cut
# of its main image and no card data.
#   vlm                  the entry of the key `vlm` for stage 1
#   thinking             true sends `enable_thinking: true`. The model then reasons
#                        before it answers: slower, and the answer can reach
#                        `describe_max_tokens`.
#   describe_side        the long side of the sent picture in pixels. A smaller picture is
#                        scaled UP, because a small catalogue photo hides small print.
#   describe_max_tokens  the limit of one answer. An answer that reaches it is asked once
#                        more with a repetition penalty and twice the limit.
#   describe_workers     the number of calls at the same time
#   timeout_s            the timeout of one call of stage 1, in seconds
#
# Stage 2 writes the rule of each cluster: one call for each cluster, with one image for
# each card (its label cut), the card data, the stage 1 descriptions, and the note.
#   rules_vlm            the entry of the key `vlm` for stage 2; null takes `vlm`. Since the
#                        owner message of 2026-09-26T16:01:00+0300 the rules come from
#                        `qwencloud-qwen3.8-max` (the key: the shell variable of the entry).
#                        The rules of `qwen3.5-9b-nvfp4` are kept as
#                        `cluster-rules.qwen3.5-9b-nvfp4.2026-09-26T1116.json` next to the
#                        rules file. A note save on `/clusters` also calls this entry.
#   rules_thinking       true for `qwen3.8-max`, with 4 calls at the same time: the choice
#                        of the owner for this model on 2026-09-23 (svoe-vino-testset),
#                        about 40 to 70 s for one rule. For `qwen3.5-9b-nvfp4`, false (the
#                        owner answer of 2026-09-26T10:19:00+0300): with thinking it used
#                        12,000 tokens in about 505 s and gave no answer. With true, keep
#                        `rules_max_tokens` at about 16000 and `rules_timeout_s` at about
#                        900.
#   rules_max_side       the long side of each label picture in pixels, scaled UP or down.
#                        The pictures shrink when the prompt estimate is too large.
#   rules_max_images     the largest number of images in one prompt that the service of
#                        `rules_vlm` accepts. The owner set the vLLM option
#                        `--limit-mm-per-prompt` of `qwen3.5-9b-nvfp4` to 20 on
#                        2026-09-26. A cluster with more cards gets an error record and
#                        no call. When the service refuses the number of images, the
#                        command stops and names the limit of the service.
#   rules_max_tokens     the limit of one answer of stage 2
#   rules_context_tokens the context of the model of `rules_vlm` (vLLM `max_model_len`).
#                        The prompt estimate stays below it minus `rules_max_tokens`.
#   rules_workers        the number of calls at the same time
#   rules_timeout_s      the timeout of one call of stage 2, in seconds
label_rules:
  vlm: qwen3.5-9b-nvfp4
  thinking: false
  describe_side: 2048
  describe_max_tokens: 1500
  describe_workers: 4
  timeout_s: 300
  rules_vlm: qwencloud-qwen3.8-max
  rules_thinking: true
  rules_max_side: 768
  rules_max_images: 20
  rules_max_tokens: 16000
  rules_context_tokens: 32768
  rules_workers: 4
  rules_timeout_s: 900

# The pipelines. A pipeline is a matcher that answers a test photo with a ranked list of
# wines. The dialog `Run>` of `/testset` and the filter `Pipeline` of `/runs` show these
# entries; they do not show the entries of `embeddings`. `pipeline/pipelines.py` reads
# this key. The key `configuration` of `run.json` names the pipeline of a run. The
# section `embeddings` prepares and uses the vectors; this section holds the runs (owner
# message of 2026-09-26T00:11:19+0300). Read docs/plans/34_pipeline-section.md.
pipeline:
  # The pipeline `vino-svoe-search-by-photo` is the official recognizer of vino-svoe.ru,
  # the baseline to beat (`backend: svoe-vino-ru`). It holds no vectors and has no build.
  # `pipeline/remote_run.py --name vino-svoe-search-by-photo --set <set>` sends each
  # photo of the set to the API as it is and writes a run. The request keys have the
  # meaning of the same keys of `backends.yaml` (docs/match-runner.md). Read
  # docs/plans/31_remote-configuration.md.
  - name: vino-svoe-search-by-photo
    backend: svoe-vino-ru
    url: https://api.vino-svoe.ru/v1/wines/search-by-photo
    field: image            # the name of the multipart field that holds the image
    response: auto          # auto | slug-object | slug-array | candidates
    query: { limit: 10 }    # the query string that asks for a ranked list
    top_k: 10
    timeout_s: 40
    # How many requests this server takes at the same time. Measured on 2026-09-17
    # from cloudzy-ams with 36 requests: at 4 at once the wall time fell by 3.2x and the
    # median latency did not rise. At 8 at once the wall time fell by 4.7x, and the
    # median latency rose by 35 percent, from 2377 ms to 3198 ms. Read `ResearchLog.md`.
    # Use `--workers 4` for the rate that costs no latency, and `--workers 1` for a run
    # whose latency is compared with the jury harness.
    workers: 8
    headers: {}             # a value "env:NAME" reads the environment variable NAME

  # Two basic pipelines of the embedding `gx10-siglip2-so400m-patch16-naflex-p256` (owner
  # message of 2026-09-26T00:45:33+0300 and the answers of 00:52:41 and 00:57:59). The key `views` holds the steps of the
  # test photo; the catalogue side stays the index of the entry, and the view `full` of
  # the photo is compared with the `full` vectors of the index. `white_background` does
  # not change an opaque photo; a transparent area becomes white.
  # `siglip2-p256-as-is`: the photo as it is, resized to a long side of 1024 px.
  - name: siglip2-p256-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p256
    views:
      full:
        steps:
          - step: white_background
          - step: resize
            max_size: 1024
            aspect: keep

  # `siglip2-p256-crop`: SAM3 finds the package, and the photo is cut to its box; the
  # background inside the box stays.
  - name: siglip2-p256-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p256
    views:
      full:
        steps:
          - step: segment
            target: package
          - step: white_background
          - step: resize
            max_size: 1024
            aspect: keep

  # `siglip2-p256-crop-seg` (owner message of 2026-09-26T23:24:00+0300, answers of
  # 23:27:00): the cut of `siglip2-p256-crop`, and the SAM3 mask of the package makes the
  # background inside the box white (`remove_background`). These are the steps of the
  # view `full` of the index, so the photo gets the pixels of a catalogue image. The YAML
  # anchor `crop-seg-views` holds the steps for the barcode twin.
  - name: siglip2-p256-crop-seg
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p256
    views: &crop-seg-views
      full:
        steps:
          - step: segment
            target: package
          - step: remove_background
          - step: white_background
          - step: resize
            max_size: 1024
            aspect: keep

  # Plan 40 (owner message of 2026-09-26T01:43:59+0300): the two basic pipelines for each
  # other entry of `embeddings`, for the benchmark of the entries. Their steps are the
  # steps of `siglip2-p256-as-is` and `siglip2-p256-crop`. The YAML anchors `as-is-views`
  # and `crop-views` of the first pair hold the steps one time; the other pairs refer to
  # them. Read docs/plans/40_embedding-benchmark.md.
  - name: siglip2-p512-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p512
    views: &as-is-views
      full:
        steps:
          - step: white_background
          - step: resize
            max_size: 1024
            aspect: keep
  - name: siglip2-p512-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p512
    views: &crop-views
      full:
        steps:
          - step: segment
            target: package
          - step: white_background
          - step: resize
            max_size: 1024
            aspect: keep
  - name: siglip2-p1024-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p1024
    views: *as-is-views
  - name: siglip2-p1024-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p1024
    views: *crop-views
  - name: siglip2-p14-384-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch14-384
    views: *as-is-views
  - name: siglip2-p14-384-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch14-384
    views: *crop-views
  - name: siglip2-256-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-256
    views: *as-is-views
  - name: siglip2-256-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-256
    views: *crop-views
  - name: siglip2-384-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-384
    views: *as-is-views
  - name: siglip2-384-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-384
    views: *crop-views
  - name: siglip2-512-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-512
    views: *as-is-views
  - name: siglip2-512-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-512
    views: *crop-views
  - name: naflexvit-p256-as-is
    backend: embedding
    embedding: gx10-naflexvit-so400m-patch16-siglip2-p256
    views: *as-is-views
  - name: naflexvit-p256-crop
    backend: embedding
    embedding: gx10-naflexvit-so400m-patch16-siglip2-p256
    views: *crop-views
  - name: pe-core-l14-336-as-is
    backend: embedding
    embedding: gx10-pe-core-l14-336
    views: *as-is-views
  - name: pe-core-l14-336-crop
    backend: embedding
    embedding: gx10-pe-core-l14-336
    views: *crop-views
  - name: dinov3-vitb16-as-is
    backend: embedding
    embedding: gx10-dinov3-vitb16
    views: *as-is-views
  - name: dinov3-vitb16-crop
    backend: embedding
    embedding: gx10-dinov3-vitb16
    views: *crop-views
  - name: dinov3-vitl16-as-is
    backend: embedding
    embedding: gx10-dinov3-vitl16
    views: *as-is-views
  - name: dinov3-vitl16-crop
    backend: embedding
    embedding: gx10-dinov3-vitl16
    views: *crop-views
  - name: local-siglip2-p256-as-is
    backend: embedding
    embedding: local-siglip2-so400m-patch16-naflex-p256
    views: *as-is-views
  - name: local-siglip2-p256-crop
    backend: embedding
    embedding: local-siglip2-so400m-patch16-naflex-p256
    views: *crop-views

  # Plan 42 (owner message of 2026-09-26T07:22:10+0300, answers of 07:27:08): a barcode
  # twin of each embedding pipeline. The key `barcode` decodes the photo as it is before
  # the views (`pipeline/barcode.py`, zxing-cpp 2.3.0 in `embedding_python`). A code that
  # `wine_code` holds for an Active wine answers the photo: each wine of the code at score
  # 1.0, and the embedding does not run. A miss runs the views and the embedding of the
  # twin. The options are the options of `barcode-siglip2-448` of svoe-vino-matcher:
  # EAN-13, and Code 128 when it holds a GTIN-13; QR; the tile scan; a long side of
  # 1600 px, and a smaller photo scaled UP to it. The YAML anchor `barcode-options` holds
  # them one time. Read docs/plans/42_barcode-step.md.
  - name: barcode-siglip2-p256-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p256
    barcode: &barcode-options
      formats: [EAN13, Code128]
      code128_gtin_only: true
      qr: true
      tile_scan: true
      max_side: 1600
      upscale: true
    views: *as-is-views
  - name: barcode-siglip2-p256-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p256
    barcode: *barcode-options
    views: *crop-views
  - name: barcode-siglip2-p256-crop-seg
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p256
    barcode: *barcode-options
    views: *crop-seg-views
  - name: barcode-siglip2-p512-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p512
    barcode: *barcode-options
    views: *as-is-views
  - name: barcode-siglip2-p512-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p512
    barcode: *barcode-options
    views: *crop-views
  - name: barcode-siglip2-p1024-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p1024
    barcode: *barcode-options
    views: *as-is-views
  - name: barcode-siglip2-p1024-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p1024
    barcode: *barcode-options
    views: *crop-views
  - name: barcode-siglip2-p14-384-as-is
    backend: embedding
    embedding: gx10-siglip2-so400m-patch14-384
    barcode: *barcode-options
    views: *as-is-views
  - name: barcode-siglip2-p14-384-crop
