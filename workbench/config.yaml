  - name: barcode-dinov3-vitb16-crop
    backend: embedding
    embedding: gx10-dinov3-vitb16
    barcode: *barcode-options
    views: *crop-views
  - name: barcode-dinov3-vitl16-as-is
    backend: embedding
    embedding: gx10-dinov3-vitl16
    barcode: *barcode-options
    views: *as-is-views
  - name: barcode-dinov3-vitl16-crop
    backend: embedding
    embedding: gx10-dinov3-vitl16
    barcode: *barcode-options
    views: *crop-views
  - name: barcode-local-siglip2-p256-as-is
    backend: embedding
    embedding: local-siglip2-so400m-patch16-naflex-p256
    barcode: *barcode-options
    views: *as-is-views
  - name: barcode-local-siglip2-p256-crop
    backend: embedding
    embedding: local-siglip2-so400m-patch16-naflex-p256
    barcode: *barcode-options
    views: *crop-views
  # The cluster re-rank of plan 48 (owner message of 2026-09-26T13:10:00+0300). When the
  # rank-1 card and another card of its cluster stand in the first `window` positions,
  # the VLM reads the label cut of the photo with the label rule of that cluster, and the
  # cards of that cluster change their order. The re-rank reads `clusters.json` and
  # `cluster-rules.json` from the directory of the pipeline embedding (plans 45 and 68).
  # `vlm` names an entry of the key `vlm`; `side` is the long side of the picture;
  # `thinking`, `max_tokens`, and `timeout_s` go into the request. With the key `barcode`
  # too, a code hit answers first and the re-rank does not run. Read
  # docs/plans/48_cluster-rerank.md.
  - name: rerank-siglip2-512-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-512
    views: *crop-views
    rerank: &rerank-options
      window: 5
      vlm: qwen3.5-9b-nvfp4
      thinking: false
      side: 1536
      max_tokens: 256
      timeout_s: 180
  - name: barcode-rerank-siglip2-512-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-512
    workers: 4
    barcode: *barcode-options
    rerank: *rerank-options
    views: *crop-views

  - name: barcode-rerank-siglip2-p512-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p512
    workers: 4
    barcode: *barcode-options
    rerank: *rerank-options
    views: *crop-views
  - name: barcode-rerank-siglip2-p1024-crop
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-naflex-p1024
    workers: 4
    barcode: *barcode-options
    rerank: *rerank-options
    views: *crop-views

  # Two retrieval towers: the package crop searches `full` vectors, and the segmented
  # label searches `label` vectors of the same index. A missing label uses `full` alone.
  # Keep the first tower equal to `barcode-rerank-siglip2-512-crop`.
  - name: barcode-rerank-siglip2-512-crop-label
    backend: embedding
    embedding: gx10-siglip2-so400m-patch16-512
    workers: 4
    barcode: *barcode-options
    rerank: *rerank-options
    views:
      full:
        steps:
          - step: segment
            target: package
          - step: white_background
          - step: resize
            max_size: 1024
            aspect: keep
      label:
        steps:
          - step: segment
            target: label
          - step: remove_background
          - step: white_background
          - step: resize
            max_size: 1024
            aspect: keep

# The VLM inferences. One entry: a name, a protocol, the thinking field, an endpoint, a
# model, and a key. `pipeline/vlm_config.py` reads this key. A client names an entry by
# its name, or through the keys `vlm` and `rules_vlm` of `cluster_rules`.
# `config.old.yaml` holds the same section.
#
# `protocol: openai` sends `POST <endpoint>/chat/completions`. `thinking_field` tells
# where the thinking switch goes: `chat_template_kwargs` sends
# `chat_template_kwargs.enable_thinking` (the gx10 gateway); `top_level` sends
# `enable_thinking` as a top field (QwenCloud and DashScope).
#
# `key` is absent or null when the service needs no key, or `{env:NAME}`: the key is
# read from the shell variable NAME at run time. Never write a key value into this
# file. The gx10 gateway needs no key.
#
# `max_tokens` is absent (8192) or a positive integer: the `max_tokens` of a detail
# request of `pipeline/describe_images.py` (owner answer of 2026-09-25). The other
# scripts keep their own limits.
vlm:
  - name: qwen3.5-9b-nvfp4
    protocol: openai
    thinking_field: chat_template_kwargs
    endpoint: http://192.168.86.14:18081/v1
    model: qwen3.5-9b-nvfp4

  - name: qwen3.5-9b
    protocol: openai
    thinking_field: chat_template_kwargs
    endpoint: http://192.168.86.14:18081/v1
    model: qwen3.5-9b

  - name: qwen3-vl-32b
    protocol: openai
    thinking_field: chat_template_kwargs
    endpoint: http://192.168.86.14:18081/v1
    model: qwen3-vl-32b

  # The QwenCloud Token Plan. Read the section "QwenCloud Token Plan API" of
  # CREDENTIALS.md in the workspace root.
  - name: qwencloud-qwen3.8-max
    protocol: openai
    thinking_field: top_level
    endpoint: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    model: qwen3.8-max
    key: "{env:QWENCLOUD_TOKEN_PLAN_API_KEY}"

  - name: qwencloud-qwen3.8-flash
    protocol: openai
    thinking_field: top_level
    endpoint: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    model: qwen3.8-flash
    key: "{env:QWENCLOUD_TOKEN_PLAN_API_KEY}"

  # Alibaba Cloud Model Studio, pay-as-you-go. It is not the QwenCloud endpoint. Read
  # the section "dashscope-intl" of CREDENTIALS.md.
  - name: dashscope-qwen3.7-flash
    protocol: openai
    thinking_field: top_level
    endpoint: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    model: qwen3.7-flash
    key: "{env:QWENCLOUD_PAYGO_API_KEY}"

# The descriptions of the images: `package_type`, `subject_scope`, `package_view`,
# `content_roles`, and `presentation_mode` (schema 024) in the table `image_description`.
# Read docs/plans/26_image-description.md.
# `watch: true` makes the lab server start `pipeline/describe_images.py --watch` and stop
# it at its exit. The watcher sends each linked image with no VLM description to the
# `vlm` entry and fills only the values that are not set. It sleeps `poll_seconds` when
# no image waits. An image stops after `max_attempts` failed answers.
# `workers` is the number of requests at the same time (1 when absent). Each request
# holds one image; two requests never hold the same image. Read
# docs/plans/35_vlm-workers.md. The owner chose 8 on 2026-09-25.
# `details: true` turns on stage 2 (docs/plans/29_image-details.md): when no image waits
# for a class, the watcher sends the detail prompt with the cut of the next eligible image
# (long side `detail_max_side`, `max_tokens` of the `vlm` entry) into `image_detail`.
# `labels: true` turns on stage 3 (docs/plans/61_label-descriptions.md): when no image
# waits for a class or a detail, the watcher sends the next linked image with no label
# description with the request of stage 1 of the cluster rules: `DESCRIBE_PROMPT` and the
# keys `vlm`, `thinking`, `describe_side`, `describe_max_tokens`, and `timeout_s` of the
# block `label_rules`. The answer goes into `image_label_description`.
image_description:
  watch: true
  vlm: qwen3.5-9b-nvfp4
  max_side: 1024
  poll_seconds: 30
  max_attempts: 3
  workers: 8
  details: true
  detail_max_side: 1536
  labels: true
