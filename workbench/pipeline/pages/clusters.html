<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Svoe Vino clusters</title>
<style>
/* THEME_CSS */

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); }
header {
  position: sticky; top: 0; z-index: 10; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow);
}
.head, .bar { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
.bar { margin-top: 8px; }
h1 { margin: 0; font-size: 15px; font-weight: 650; }
.nav { display: flex; gap: 6px; margin-left: auto; }
.nav a {
  color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600;
  padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel-2);
}
.nav a:hover { color: var(--text); border-color: var(--accent); }
.nav a.on { color: var(--text); border-color: var(--accent); background: var(--panel); }
label { display: flex; gap: 5px; align-items: center; color: var(--muted); font-size: 12px; }
select, input, button, textarea {
  color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 13px;
}
#embedding { max-width: min(560px, 90vw); }
input[type=number] { width: 82px; }
input[type=search] { width: min(360px, 85vw); }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { cursor: default; opacity: .5; }
#build { border-color: var(--accent); font-weight: 700; }
.message { color: var(--muted); font-size: 12px; }
.message.error, .error { color: var(--exc); }
main { max-width: 1800px; margin: 0 auto; padding: 14px 16px 64px; }
.summary {
  display: grid; gap: 4px; padding: 9px 11px; margin-bottom: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  font-size: 12px; overflow-wrap: anywhere;
}
.summary-row { display: flex; gap: 8px 18px; flex-wrap: wrap; }
.summary b { font-weight: 650; }
.bad { color: var(--exc); font-weight: 700; }
.good { color: var(--pos); font-weight: 700; }
.warn { color: var(--var); font-weight: 700; }
.empty {
  padding: 28px; color: var(--muted); background: var(--panel);
  border: 1px dashed var(--line); border-radius: 10px; text-align: center;
}
.list { display: grid; gap: 14px; }
.cluster {
  scroll-margin-top: 124px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 11px; overflow: hidden; box-shadow: var(--shadow);
}
.cluster.target { outline: 2px solid var(--accent); outline-offset: 2px; }
.cluster-head {
  display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap;
  padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2);
}
.cluster-head h2 { margin: 0; font-size: 15px; }
.badge {
  padding: 2px 7px; border-radius: 999px; background: var(--unu-bg);
  color: var(--unu); font-size: 11px; font-weight: 700;
}
.badge.full { color: var(--neg); background: var(--neg-bg); }
.badge.label { color: var(--pos); background: var(--pos-bg); }
.badge.mixed { color: var(--var); background: var(--var-bg); }
/* A manual pair of `wine_similar` (plan 62). */
.badge.manual { color: var(--accent); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--accent); }
/* Two wines of one GTIN of `wine_code` (plan 64). */
.badge.gtin { color: var(--text); background: var(--grp-b); box-shadow: inset 0 0 0 1px var(--muted); }
.cluster-key { color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
/* The bottle card has the form of the card of the 8154 Clusters page. */
.members { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
.member {
  width: 176px; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px; position: relative;
}
.member .no {
  position: absolute; top: 9px; left: 9px; z-index: 2; font-size: 11px; font-weight: 700;
  background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 4px;
}
.member .pic { display: block; padding: 0; border: 0; border-radius: 0; background: none; cursor: zoom-in; }
.member img, .member .nobottle {
  width: 162px; height: 200px; object-fit: contain; display: block;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
}
/* The cut is transparent around the package or the label. The checkerboard shows the
   transparency, as on /embedding and /dataset. */
.member img {
  background-color: #fff;
  background-image:
    linear-gradient(45deg, #d0d0d0 25%, transparent 25%),
    linear-gradient(-45deg, #d0d0d0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #d0d0d0 75%),
    linear-gradient(-45deg, transparent 75%, #d0d0d0 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.member .nobottle { display: flex; align-items: center; justify-content: center;
                    color: var(--muted); font-size: 11px; text-align: center; }
.member .nm { font-weight: 600; font-size: 13px; margin-top: 4px; line-height: 1.25; }
.member .pr, .member .gr { font-size: 11px; color: var(--muted); line-height: 1.3; }
.member .sl { font-size: 10px; word-break: break-all; line-height: 1.25; margin-top: 2px; }
.no-image { margin-top: 8px; color: var(--muted); font-size: 11px; font-style: italic; }
details { border-top: 1px solid var(--line); }
summary { cursor: pointer; padding: 8px 12px; font-weight: 650; }
.links-wrap { overflow-x: auto; padding: 0 12px 12px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 12px; }
th, td { padding: 5px 7px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; }
.pair { max-width: 270px; overflow-wrap: anywhere; }
.evidence { display: grid; gap: 2px; }
.evidence a { font-size: 11px; overflow-wrap: anywhere; }
.sim { font-variant-numeric: tabular-nums; font-weight: 700; }
.review { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr); gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
.review h3 { margin: 0 0 5px; font-size: 13px; }
.note textarea { width: 100%; min-height: 74px; resize: vertical; }
.note-actions { display: flex; gap: 8px; align-items: center; margin-top: 5px; }
.inherited { color: var(--var); font-size: 11px; }
.rule { min-width: 0; }
.rule pre {
  max-height: 220px; overflow: auto; margin: 0; padding: 7px;
  background: var(--panel-2); border-radius: 6px; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
/* The dialog is a column: the head takes its own height, and the image fills the rest.
   So a head that wraps or a tall viewport gives no scroll bar. */
#preview {
  width: min(1000px, calc(100vw - 30px)); height: min(90vh, 1000px); padding: 0;
  color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
}
#preview[open] { display: flex; flex-direction: column; }
#preview::backdrop { background: rgba(4, 5, 8, .72); }
.preview-head { flex: none; display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.preview-title { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.preview-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 42px minmax(0, 1fr) 42px; grid-template-rows: minmax(0, 1fr); align-items: center; padding: 10px; }
.preview-body img { display: block; width: 100%; height: 100%; object-fit: contain; }
.preview-body button { height: 52px; font-size: 22px; }
@media (max-width: 760px) {
  .nav { width: 100%; margin-left: 0; overflow-x: auto; }
  .review { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .member { width: calc(50% - 5px); }
  .member .pic, .member img, .member .nobottle { width: 100%; }
  .member img, .member .nobottle { height: 160px; }
}
</style>
</head>
<body>
<header>
  <div class="head">
    <h1>Clusters</h1>
    <div class="bar" style="margin-top:0">
      <label>Configuration <select id="embedding"></select></label>
      <label>Space <select id="space">
        <option value="combined">combined</option>
        <option value="full">full</option>
        <option value="label">label</option>
      </select></label>
      <label title="The image of the card in the space combined">Image <select id="image">
        <option value="full">full</option>
        <option value="label">label</option>
      </select></label>
      <button id="build" type="button" disabled>Build clusters</button>
      <button id="build-all" type="button" title="Build the clusters of each configuration, one at a time, in the order of config.yaml">Build all clusters</button>
      <span class="message" id="queue"></span>
      <span class="message" id="message"></span>
    </div>
    <nav class="nav"><a href="/dataset">Dataset</a><a href="/embedding">Embeddings</a><a
      class="on" href="/clusters">Clusters</a><a href="/testset">Testset</a><a
      href="/runs">Runs</a><a
      href="/recognize">Recognize</a><a href="/health">Health</a></nav>
  </div>
  <div class="bar">
    <label>Search <input id="search" type="search" placeholder="name, producer, slug"></label>
  </div>
</header>
<main>
  <section class="summary" id="summary">Reading configurations…</section>
  <section class="list" id="list"></section>
</main>
<dialog id="preview">
  <div class="preview-head"><strong class="preview-title" id="preview-title"></strong>
    <a id="preview-original" href="" target="_blank" rel="noopener">open original</a>
    <button id="preview-close" type="button">Close</button></div>
  <div class="preview-body"><button id="preview-previous" type="button">←</button>
    <img id="preview-image" alt=""><button id="preview-next" type="button">→</button></div>
</dialog>
<script>
const $ = selector => document.querySelector(selector);
const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[char]));
const PARAMS = new URLSearchParams(location.search);
/* The header controls are kept in localStorage and come back at the next page load (owner
   message of 2026-09-26T00:30:00+0300). A value in the URL wins over the stored value. */
const HEADER_KEY = "svl.clusters.header";
function storedHeader() {
  try { return JSON.parse(localStorage.getItem(HEADER_KEY) || "{}") || {}; } catch (_) { return {}; }
}
const HEADER = storedHeader();
function saveHeader() {
  const value = {name: NAME, space: SPACE, image: IMAGE, search: $("#search").value};
  try { localStorage.setItem(HEADER_KEY, JSON.stringify(value)); } catch (_) { /* no storage */ }
}
let ENTRIES = [], DATA = null, NAME = "", SPACE = PARAMS.get("space") || HEADER.space || "combined";
// `updateUrl` writes `space` always and `image` only when it is not `full`, so an address
// with `space` holds the image too.
let IMAGE = (PARAMS.has("space") ? PARAMS.get("image") : HEADER.image) === "label" ? "label" : "full";
let PREVIEW = [], PREVIEW_GROUP = 0, PREVIEW_INDEX = 0;
if (typeof HEADER.search === "string") $("#search").value = HEADER.search;

function setMessage(text, error=false) {
  $("#message").textContent = text || "";
  $("#message").classList.toggle("error", error);
}

async function request(url, options={}) {
  const response = await fetch(url, options);
  let body;
  try { body = await response.json(); } catch (_) { body = {error: await response.text()}; }
  if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
  return body;
}

function updateUrl() {
  const query = new URLSearchParams();
  if (NAME) query.set("name", NAME);
  query.set("space", SPACE);
  if (SPACE === "combined" && IMAGE !== "full") query.set("image", IMAGE);
  history.replaceState(null, "", `${location.pathname}?${query}${location.hash}`);
}

function entryLabel(entry) {
  if (entry.error) return `${entry.name} — configuration error`;
  if (!entry.exists) return `${entry.name} — not built`;
  const count = entry.counts?.[SPACE]?.clusters ?? 0;
  return `${entry.name} — ${count} clusters${entry.stale ? " — stale" : ""}`;
}

function fillEntries() {
  const select = $("#embedding");
  select.innerHTML = ENTRIES.map(entry =>
    `<option value="${esc(entry.name)}"${entry.error ? " disabled" : ""}>${esc(entryLabel(entry))}</option>`
  ).join("");
  const wanted = NAME || PARAMS.get("name") || HEADER.name;
  const chosen = ENTRIES.find(entry => entry.name === wanted && !entry.error)
    || ENTRIES.find(entry => entry.exists && !entry.error)
    || ENTRIES.find(entry => !entry.error);
  NAME = chosen?.name || "";
  select.value = NAME;
  $("#build").disabled = !NAME;
}

function statusCounts(status={}) {
  return ["current", "stale", "missing", "failed"].map(key => {
    const value = status[key] || 0;
    const cls = key === "current" ? "good" : value ? (key === "failed" ? "bad" : "warn") : "";
    return `<span class="${cls}">${esc(key)} ${value}</span>`;
  }).join(" · ");
}

function renderSummary() {
  if (!DATA) return;
  const status = DATA.status || {};
  const artifact = DATA.artifact;
  if (!artifact) {
    $("#summary").innerHTML = `<div><b>Directory:</b> ${esc(status.directory || "")}</div>
      <div class="warn">No clusters.json. Build the selected configuration.</div>`;
    return;
  }
  const input = artifact.inputs || {};
  const settings = artifact.settings || {};
  const counts = artifact.spaces?.[SPACE]?.counts || {};
  const stale = status.stale ? '<span class="bad">stale</span>' : '<span class="good">current</span>';
  $("#summary").innerHTML = `
    <div class="summary-row"><span><b>File:</b> ${esc(status.file)}</span><span>${stale}</span></div>
    <div class="summary-row"><span><b>Built:</b> ${esc(artifact.built_at)}</span>
      <span><b>Embedding:</b> ${esc(input.updated_at || "?")}</span>
      <span><b>Vectors:</b> ${esc(input.vectors_file || "?")} · ${esc(input.dim || "?")} dimensions</span>
      <span title="The block clusters of config.yaml sets these values"><b>Build settings:</b> full threshold ${esc(settings.full_threshold ?? "?")} · label threshold ${esc(settings.label_threshold ?? "?")} · minimum size ${esc(settings.min_cluster_size ?? 2)}</span></div>
    <div class="summary-row"><span><b>Items:</b> ${statusCounts(input.status)}</span>
      <span><b>${esc(SPACE)}:</b> ${counts.clusters || 0} clusters · ${counts.links || 0} links · ${counts.wines_in_clusters || 0} wines · largest ${counts.largest || 0}</span></div>`;
}

/* The view of the card image: the view of the space, or the "Image" select in the
   space combined. */
function imageView() {
  return SPACE === "combined" ? IMAGE : SPACE;
}

/* The page draws the segmented cut with its transparent background (owner message of
   2026-09-26T09:51:00+0300). The prepared image is the model input on white; it stays
   the fallback for an image with no cut, such as a close-up. */
function imageHtml(image, slug) {
  const title = `${slug} · ${image.view} · ${(image.image_types || []).join(", ")}`;
  const shown = image.cut_url || image.prepared_url;
  const encoded = encodeURIComponent(JSON.stringify({
    url: shown, original: image.original_url, title
  }));
  return `<button class="pic" type="button" data-preview="${encoded}" title="${esc(title)}">
    <img src="${esc(shown)}" alt="${esc(title)}" loading="lazy"></button>`;
}

/* The image of a card: the main image of the wine in the view, `main_patched` or `main`
   (owner message of 2026-09-27T20:11:15+0300). The server sorts the images by their
   types, so `full_back` comes first. A wine with no current main image shows the first
   image of the view. */
const MAIN_TYPES = ["main_patched", "main"];

function cardImage(card, view) {
  const images = (card.images || []).filter(item => item.view === view);
  return images.find(item => (item.image_types || []).some(type => MAIN_TYPES.includes(type)))
    || images[0];
}

function memberHtml(slug, index) {
  const card = DATA.cards?.[slug] || {slug};
  const view = imageView();
  const image = cardImage(card, view);
  return `<article class="member"><span class="no">#${index + 1}</span>
    ${image ? imageHtml(image, slug) : `<div class="nobottle">No current ${esc(view)} image.</div>`}
    <div class="nm">${esc(card.name || slug)}</div>
    <div class="pr">${esc(card.producer || "")}${card.category ? " · " + esc(card.category) : ""}</div>
    ${card.grapes ? `<div class="gr">${esc(card.grapes)}</div>` : ""}
    <div class="sl">${esc(slug)}</div>
  </article>`;
}

function shortSlug(slug) {
  return slug.length > 44 ? `${slug.slice(0, 41)}…` : slug;
}

function evidenceHtml(record) {
  if (!record) return "—";
  const left = record.a_image || {}, right = record.b_image || {};
  return `<div class="evidence"><span class="sim">${Number(record.similarity).toFixed(4)}</span>
    <a href="${esc(left.prepared_url)}" target="_blank" rel="noopener">A: ${esc((left.image_types || []).join(" + "))} · ${esc((left.source_sha256 || "").slice(0, 8))}</a>
    <a href="${esc(right.prepared_url)}" target="_blank" rel="noopener">B: ${esc((right.image_types || []).join(" + "))} · ${esc((right.source_sha256 || "").slice(0, 8))}</a></div>`;
}

function linksHtml(cluster) {
  const rows = (cluster.links || []).map(link => `<tr>
    <td class="pair"><b>A</b> ${esc(shortSlug(link.a))}<br><b>B</b> ${esc(shortSlug(link.b))}</td>
    <td>${(link.by || []).map(value => `<span class="badge ${esc(value)}">${esc(value)}</span>`).join(" ")}</td>
    <td>${evidenceHtml(link.spaces?.full)}</td><td>${evidenceHtml(link.spaces?.label)}</td>
  </tr>`).join("");
  return `<details><summary>Edges (${cluster.links?.length || 0})</summary><div class="links-wrap">
    <table><thead><tr><th>Wine pair</th><th>Signal</th><th>Full evidence</th><th>Label evidence</th></tr></thead>
    <tbody>${rows}</tbody></table></div></details>`;
}

function ruleHtml(rule) {
  if (!rule) return '<div class="no-image">No VLM difference rule.</div>';
  const state = rule.stale ? '<span class="bad">stale</span>' : '<span class="good">current</span>';
  const shown = {...rule}; delete shown.raw_reply; delete shown.prompt;
  return `<div>${state}</div><pre>${esc(JSON.stringify(shown, null, 2))}</pre>`;
}

function clusterHtml(cluster) {
  const note = cluster.note || {text: ""};
  const inherited = note.inherited
    ? `<span class="inherited">Inherited from ${esc(note.from_key)}. Save to attach it to this member set.</span>` : "";
  const anchors = cluster.slugs.map(slug => `<span id="anchor-${esc(slug)}"></span>`).join("");
  return `<section class="cluster" id="cluster-${esc(cluster.key)}" data-slugs="${esc(cluster.slugs.join(" ").toLowerCase())}">
    ${anchors}<div class="cluster-head"><h2>${esc(cluster.id)} · ${cluster.size} wines</h2>
      <span class="badge ${esc(cluster.kind)}">${esc(cluster.kind)}</span>
      ${(cluster.signals || []).map(signal => `<span class="badge ${esc(signal)}">${esc(signal)}</span>`).join("")}
      <span class="cluster-key">${esc(cluster.key)}</span></div>
    <div class="members">${cluster.slugs.map(memberHtml).join("")}</div>
    ${linksHtml(cluster)}
    <div class="review"><div class="note"><h3>Reviewer note</h3>
      <textarea maxlength="4000" data-note="${esc(cluster.key)}">${esc(note.text || "")}</textarea>
      <div class="note-actions"><button type="button" data-save-note="${esc(cluster.key)}">Save note</button>${inherited}<span data-note-status="${esc(cluster.key)}"></span></div>
    </div><div class="rule"><h3>VLM difference rule</h3>${ruleHtml(cluster.rule)}</div></div>
  </section>`;
}

function clusterSearchText(cluster) {
  return cluster.slugs.map(slug => {
    const card = DATA.cards?.[slug] || {};
    return [slug, card.name, card.producer, card.category, card.color, card.grapes, card.region].join(" ");
  }).join(" ").toLowerCase();
}

/* The "Image" select chooses the image in the space combined alone. In the spaces
   full and label, it shows the view of the space. */
function syncImage() {
  $("#image").value = imageView();
  $("#image").disabled = SPACE !== "combined";
}

function render() {
  syncImage();
  renderSummary();
  const artifact = DATA?.artifact;
  if (!artifact) {
    $("#list").innerHTML = '<div class="empty">Build clusters to populate this page.</div>';
    return;
  }
  const all = artifact.spaces?.[SPACE]?.clusters || [];
  const query = $("#search").value.trim().toLowerCase();
  const shown = all.filter(cluster => !query || clusterSearchText(cluster).includes(query));
  $("#list").innerHTML = shown.length ? shown.map(clusterHtml).join("")
    : `<div class="empty">No cluster matches the filters. ${all.length} cluster(s) exist in ${esc(SPACE)}.</div>`;
  bindDynamic();
  openHash();
}

/* One preview group for each shown cluster with an image. ←/→ move inside the group and
   wrap at its ends. ↑/↓ open the first image of the previous or the next group and wrap
   at the ends of the list (owner messages of 2026-09-26T09:30:30+0300 and 09:32:30). */
function previewGroups() {
  return [...document.querySelectorAll(".cluster")].map(section => ({
    id: section.querySelector(".cluster-head h2").textContent.split(" · ")[0],
    buttons: [...section.querySelectorAll("[data-preview]")]
  })).filter(group => group.buttons.length);
}

function showPreview(group, index) {
  if (!PREVIEW.length) return;
  PREVIEW_GROUP = (group + PREVIEW.length) % PREVIEW.length;
  const buttons = PREVIEW[PREVIEW_GROUP].buttons;
  PREVIEW_INDEX = (index + buttons.length) % buttons.length;
  const item = JSON.parse(decodeURIComponent(buttons[PREVIEW_INDEX].dataset.preview));
  $("#preview-title").textContent = `${item.title} · ${PREVIEW_INDEX + 1}/${buttons.length}` +
    ` · cluster ${PREVIEW[PREVIEW_GROUP].id} (${PREVIEW_GROUP + 1}/${PREVIEW.length})`;
  $("#preview-image").src = item.url;
  $("#preview-image").alt = item.title;
  $("#preview-original").href = item.original;
}

function bindDynamic() {
  PREVIEW = previewGroups();
  PREVIEW.forEach((group, groupIndex) => group.buttons.forEach((button, index) => button.addEventListener("click", () => {
    showPreview(groupIndex, index); $("#preview").showModal();
  })));
  document.querySelectorAll("[data-save-note]").forEach(button => button.addEventListener("click", async () => {
    const key = button.dataset.saveNote;
    const textarea = document.querySelector(`[data-note="${key}"]`);
    const status = document.querySelector(`[data-note-status="${key}"]`);
    const before = ruleOf(DATA, key)?.built_at;
    button.disabled = true; status.textContent = "Saving…";
    try {
      const answer = await request(`/api/clusters/${encodeURIComponent(NAME)}/note`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({space: SPACE, key, text: textarea.value})
      });
      status.textContent = "Saved";
      await loadDetail(false);
      // The server rebuilds the label rule in a separate process (plan 45). The view
      // `full` shows no label rule.
      const rebuild = answer.rule_rebuild || {};
      if (rebuild.started && SPACE !== "full") watchRule(key, before, rebuild.log);
      else if (rebuild.error) noteStatus(key, `Saved; the rule rebuild did not start: ${rebuild.error}`, true);
    } catch (error) { status.textContent = error.message; status.className = "error"; }
    finally { button.disabled = false; }
  }));
}

/* The rule of the cluster `key` in the view SPACE of a detail answer, or undefined. */
function ruleOf(detail, key) {
  return (detail?.artifact?.spaces?.[SPACE]?.clusters || []).find(item => item.key === key)?.rule;
}

/* The status text beside `Save note`. A render makes a new element, so the code finds it
   again each time. */
function noteStatus(key, text, error=false) {
  const status = document.querySelector(`[data-note-status="${key}"]`);
  if (status) { status.textContent = text; status.className = error ? "error" : ""; }
}

/* After a note change, poll the detail every 3 s, for at most 5 minutes, until the label
   rule of the cluster is current (owner answer of 2026-09-26T11:11:00+0300). Then swap
   only the rule block of that cluster, so an open preview stays as it is. */
async function watchRule(key, before, log) {
  noteStatus(key, "Saved · rebuilding the rule…");
  const deadline = Date.now() + 5 * 60 * 1000;
  while (Date.now() < deadline) {
    await new Promise(resolve => setTimeout(resolve, 3000));
    let detail;
    try { detail = await request(`/api/clusters/${encodeURIComponent(NAME)}`); }
    catch (error) { continue; }
    const rule = ruleOf(detail, key);
    if (!rule || rule.stale) continue;
    DATA = detail;
    const block = document.querySelector(`[data-note="${key}"]`)?.closest(".cluster")?.querySelector(".rule");
    if (block) block.innerHTML = `<h3>VLM difference rule</h3>${ruleHtml(rule)}`;
    if (rule.error) noteStatus(key, `The rule build failed: ${rule.error}`, true);
    else noteStatus(key, rule.built_at !== before ? "Rule rebuilt" : "The rule is current");
    return;
  }
  noteStatus(key, `The rule is not rebuilt yet. The log is ${log}`, true);
}

function openHash() {
  document.querySelectorAll(".cluster.target").forEach(node => node.classList.remove("target"));
  const slug = decodeURIComponent(location.hash.slice(1));
  if (!slug) return;
  const anchor = document.getElementById(`anchor-${slug}`);
  const cluster = anchor?.closest(".cluster");
  if (cluster) { cluster.classList.add("target"); cluster.scrollIntoView({block: "start"}); }
}

async function loadDetail(showMessage=true) {
  if (!NAME) return;
  if (showMessage) setMessage("Loading…");
  try {
    DATA = await request(`/api/clusters/${encodeURIComponent(NAME)}`);
    setMessage(""); render(); updateUrl();
  } catch (error) {
    DATA = null; setMessage(error.message, true);
    $("#summary").innerHTML = `<div class="error">${esc(error.message)}</div>`;
    $("#list").innerHTML = "";
  }
}

async function loadList() {
  try {
    const data = await request("/api/clusters");
    ENTRIES = data.embeddings || []; fillEntries();
    showQueue(data.queue);
    $("#space").value = ["combined", "full", "label"].includes(SPACE) ? SPACE : "combined";
    SPACE = $("#space").value;
    if (!NAME) {
      $("#summary").innerHTML = '<div class="error">config.yaml has no valid embedding.</div>';
      return;
    }
    await loadDetail();
  } catch (error) {
    setMessage(error.message, true);
    $("#summary").innerHTML = `<div class="error">${esc(error.message)}</div>`;
  }
}

$("#embedding").addEventListener("change", () => { NAME = $("#embedding").value; loadDetail(); });
$("#space").addEventListener("change", () => {
  SPACE = $("#space").value; updateUrl();
  [...$("#embedding").options].forEach((option, index) => option.textContent = entryLabel(ENTRIES[index]));
  render();
});
$("#image").addEventListener("change", () => { IMAGE = $("#image").value; updateUrl(); render(); });
$("#search").addEventListener("input", render);
// The listeners of each control run first; the header listener then stores the new values.
$("header").addEventListener("change", saveHeader);
$("header").addEventListener("input", saveHeader);
/* The thresholds and the limits of a build come from the block `clusters` of config.yaml. */
$("#build").addEventListener("click", async () => {
  $("#build").disabled = true; setMessage("Building clusters…");
  try {
    await request(`/api/clusters/${encodeURIComponent(NAME)}/build`, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"
    });
    setMessage("Clusters built"); await loadList();
  } catch (error) { setMessage(error.message, true); }
  finally { $("#build").disabled = !NAME; }
});
/* Build all clusters (plan 65): a queue of the server builds the clusters of each
   configuration, one at a time. The page polls /api/clusters every 2 s while it runs. */
let QUEUE_TIMER = null;
function queueText(queue) {
  if (!queue) return "";
  if (queue.state === "running") {
    return `Build all clusters ${queue.index + 1} / ${queue.names.length}: ${queue.current}`
      + (queue.waiting ? ` · waiting: ${queue.waiting}` : "");
  }
  if (queue.state === "failed") return `Build all clusters failed: ${queue.message || ""}`;
  const count = state => queue.results.filter(result => result.state === state).length;
  return `Build all clusters done: ${count("done")} built`
    + ["skipped", "failed"].filter(count).map(state => ` · ${state} ${count(state)}`).join("");
}
function showQueue(queue) {
  const running = queue?.state === "running";
  $("#build-all").disabled = running;
  const span = $("#queue");
  span.textContent = queueText(queue);
  span.classList.toggle("error", queue?.state === "failed"
    || (queue?.results || []).some(result => result.state === "failed"));
  span.title = (queue?.results || []).map(result =>
    `${result.name}: ${result.state}${result.message ? ` — ${result.message}` : ""}`).join("\n");
  if (running && !QUEUE_TIMER) QUEUE_TIMER = setTimeout(pollQueue, 2000);
}
async function pollQueue() {
  QUEUE_TIMER = null;
  try {
    const data = await request("/api/clusters");
    ENTRIES = data.embeddings || []; fillEntries();
    showQueue(data.queue);
    if (data.queue?.state !== "running" && NAME) await loadDetail(false);
  } catch (error) {
    $("#queue").textContent = error.message; $("#queue").classList.add("error");
    QUEUE_TIMER = setTimeout(pollQueue, 2000);
  }
}
$("#build-all").addEventListener("click", async () => {
  $("#build-all").disabled = true;
  try {
    showQueue((await request("/api/clusters/build-all", {method: "POST"})).queue);
  } catch (error) {
    $("#queue").textContent = error.message; $("#queue").classList.add("error");
    $("#build-all").disabled = false;
  }
});
$("#preview-close").addEventListener("click", () => $("#preview").close());
$("#preview-previous").addEventListener("click", () => showPreview(PREVIEW_GROUP, PREVIEW_INDEX - 1));
$("#preview-next").addEventListener("click", () => showPreview(PREVIEW_GROUP, PREVIEW_INDEX + 1));
document.addEventListener("keydown", event => {
  if (!$("#preview").open) return;
  if (event.key === "ArrowLeft") showPreview(PREVIEW_GROUP, PREVIEW_INDEX - 1);
  else if (event.key === "ArrowRight") showPreview(PREVIEW_GROUP, PREVIEW_INDEX + 1);
  else if (event.key === "ArrowUp") showPreview(PREVIEW_GROUP - 1, 0);
  else if (event.key === "ArrowDown") showPreview(PREVIEW_GROUP + 1, 0);
  else return;
  event.preventDefault();
});
window.addEventListener("hashchange", openHash);
loadList();
</script>
</body>
</html>
