<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production error review</title><style>
/* THEME_CSS */
body{max-width:1100px;margin:24px auto;padding:0 20px;font:16px system-ui}article{border:1px solid #9995;border-radius:12px;padding:16px;margin:16px 0}img{max-width:220px;max-height:280px;float:left;margin:0 20px 12px 0}article:after{content:'';display:block;clear:both}label{display:block;margin:8px 0}input,select,textarea,button{font:inherit;padding:6px;max-width:100%}textarea{width:500px}pre{white-space:pre-wrap}#status{position:sticky;top:0;background:Canvas;padding:8px}a{color:inherit}
</style><nav><a href="/dataset">Dataset</a> · <a href="/testset">Testset</a> · <a href="/runs">Runs</a></nav><h1>Production error review</h1><p>Feedback is evidence. Review the identity before publication. Use an empty identity only after an explicit no-match review. Reference and benchmark image families stay separate.</p><label>Import one request snapshot (JSON with image_base64) <input id="import" type="file" accept="application/json"></label><p id="status" role="status"></p><div id="records"></div><script>
const status=document.querySelector('#status');
async function request(path,body){const r=await fetch('/api/production-errors'+path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
function element(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}
function field(article,label,tag='input',options){const l=element('label',label+' '),e=element(tag);if(options)for(const [value,text]of options){const o=element('option',text);o.value=value;e.append(o)}l.append(e);article.append(l);return e}
async function load(){try{const data=await request('');document.querySelector('#records').replaceChildren();for(const row of data.records){const a=element('article');a.append(element('h2',`${row.source}/${row.request_id} · ${row.state}`));const image=element('img');image.alt='Archived request image';image.src='/api/production-errors/image?'+new URLSearchParams({source:row.source,request_id:row.request_id});a.append(image);a.append(element('pre',JSON.stringify({image_sha256:row.image_sha256,candidates:row.candidates,feedback:row.feedback,destination:row.destination},null,2)));if(row.state!=='published'){const identity=field(a,'Reviewed catalog slug (empty = explicit no match)');identity.value=row.identity||'';const purpose=field(a,'Purpose','select',[['benchmark','Benchmark query'],['reference','Reference photo']]);purpose.value=row.purpose||'benchmark';const reviewer=field(a,'Reviewer');reviewer.value=row.reviewer||'';const note=field(a,'Review evidence','textarea');note.value=row.review_note||'';for(const reject of [false,true]){const b=element('button',reject?'Reject image':'Save review');b.onclick=()=>act('/review',{source:row.source,request_id:row.request_id,identity:identity.value.trim()||null,purpose:purpose.value,reviewer:reviewer.value,note:note.value,reject});a.append(b)}}if(row.state==='reviewed'){const set=field(a,'Benchmark set');set.value='production-reviewed';const type=field(a,'Reference image type','select',[['full_front','Full front'],['label_front','Label front'],['full_back','Full back'],['label_back','Label back']]);const b=element('button','Publish reviewed image');b.onclick=()=>act('/publish',{source:row.source,request_id:row.request_id,set:set.value,image_type:type.value});a.append(b)}document.querySelector('#records').append(a)}}catch(e){status.textContent=e.message}}
async function act(path,body){try{const result=await request(path,body);status.textContent=result.index_update_required?'Reference stored. Use the existing embedding build to update the index.':'Saved.';await load()}catch(e){status.textContent=e.message}}
document.querySelector('#import').onchange=async event=>{const f=event.target.files[0];if(!f)return;try{if(f.size>14*1024*1024)throw Error('Snapshot exceeds 14 MiB');await act('/import',JSON.parse(await f.text()))}catch(e){status.textContent=e.message}event.target.value=''};load();
</script></html>
