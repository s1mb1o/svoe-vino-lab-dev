  /api/testset-photo-tag:
    post:
      tags: [testsets]
      operationId: addTestPhotoTag
      summary: Add a tag to every test photo with the same image bytes.
      requestBody:
        $ref: "#/components/requestBodies/TestsetPhotoWrite"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-photo-tag-remove:
    post:
      tags: [testsets]
      operationId: removeTestPhotoTag
      summary: Remove one image tag.
      requestBody:
        $ref: "#/components/requestBodies/TestsetPhotoWrite"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-box:
    post:
      tags: [testsets]
      operationId: setTestPhotoBox
      summary: Set or clear one photo bounding box.
      requestBody:
        $ref: "#/components/requestBodies/TestsetPhotoWrite"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-move:
    post:
      tags: [testsets]
      operationId: moveTestPhoto
      summary: Move a photo to a wine, No Match, or the Drawer.
      requestBody:
        $ref: "#/components/requestBodies/TestsetPhotoWrite"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-upload:
    post:
      tags: [testsets]
      operationId: uploadTestPhoto
      summary: Upload raw image bytes to one place in a test set.
      parameters:
        - $ref: "#/components/parameters/SetQuery"
        - $ref: "#/components/parameters/PlaceQuery"
        - $ref: "#/components/parameters/FileNameRequired"
      requestBody:
        $ref: "#/components/requestBodies/Image"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-fetch:
    post:
      tags: [testsets]
      operationId: fetchTestPhoto
      summary: Safely fetch a remote image and add it to one test-set place.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestsetFetch" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-from-run:
    get:
      tags: [testsets, runs]
      operationId: getTestsetFromRunProposal
      summary: Read the proposed test-set name and miss counts of one run.
