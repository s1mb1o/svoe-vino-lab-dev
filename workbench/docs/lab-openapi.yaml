      tags: [runs]
      operationId: getRunCandidate
      summary: Read the catalogue inputs and cosines of one candidate.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
        - $ref: "#/components/parameters/QueryId"
        - $ref: "#/components/parameters/SlugQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-image-tag:
    post:
      tags: [runs]
      operationId: addRunImageTag
      summary: Add a shared image tag to one recorded run query.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, query, tag]
              properties:
                id: { type: string }
                query: { type: string }
                tag: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-image-tag-remove:
    post:
      tags: [runs]
      operationId: removeRunImageTag
      summary: Remove a shared image tag from one recorded run query.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, query, tag]
              properties:
                id: { type: string }
                query: { type: string }
                tag: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/drawer-runs:
    get:
      tags: [runs, testset]
      operationId: listDrawerRuns
      summary: List completed Drawer matching runs for one test set.
      parameters:
        - $ref: "#/components/parameters/SetQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/drawer-match-accept:
    post:
      tags: [runs, testset]
      operationId: acceptDrawerMatch
      summary: Move a Drawer photo to a recorded top-K candidate and mark it positive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, query, set, to]
              properties:
                id: { type: string }
                query: { type: string }
                set: { type: string }
                to: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-vlm-image:
    get:
      tags: [runs]
      operationId: getRunVlmImage
      summary: Read the verified PNG sent to the VLM re-rank of one saved query.
      description: Uses recorded input bytes or local cache recovery with a matching sent-image hash. Makes no model request. Returns 404 when the input cannot be verified.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200":
          description: The verified VLM input PNG.
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/run-patches:
    get:
      tags: [runs]
      operationId: inspectOriginalRunPatches
      summary: Read or compute local experimental patch diagnostics for a saved query.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
        - $ref: "#/components/parameters/QueryId"
        - in: query
          name: start
          schema: { type: integer, enum: [1] }
          description: Start one local diagnostic worker if no result exists.
        - in: query
          name: candidate
          schema: { type: integer, minimum: 0, maximum: 9 }
          description: Read one image panel for a ready experiment candidate.
        - in: query
          name: panel
          schema: { type: string, enum: [reference, query, reference_weights, query_weights], default: reference }
          description: Select one cropped original image or patch-weight image.
      responses:
        "200":
          description: Local job status, ready diagnostics, or a checked crop or patch-weight image.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/run-steps:
    get:
      tags: [runs]
      operationId: getRunSteps
      summary: Read the recorded processing steps of one query.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-configurations:
    get:
      tags: [runs]
      operationId: listRunConfigurations
      summary: Read runnable pipeline configurations for one test set.
      parameters:
        - $ref: "#/components/parameters/SetQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-jobs:
    get:
      tags: [runs]
      operationId: listRunJobs
      summary: Read the state of each run job.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [runs]
      operationId: startRunJob
      summary: Start a pipeline run or an embedding self-test.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunJobStart" }
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-jobs/{name}/stop:
    post:
      tags: [runs]
      operationId: stopRunJob
      summary: Send SIGTERM to one running job.
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/atlas-import/advance:
    post:
      tags: [atlas-import]
      operationId: advanceAtlasImport
      summary: Send the missing Atlas requests of the three product-page steps.
      description: >-
        Stage 1 is the white-field removal and the PDF extraction. Stage 2, when each
        stage 1 task is terminal, is the barcode recognition. A step with a task gets no
        new request. The answer holds `stage`, `done`, `steps`, `product`, and `prefill`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: "An Atlas product URL on a loopback host." }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/atlas-import/photos:
    get:
      tags: [atlas-import]
      operationId: getAtlasImportPhotos
      summary: Read the best photo of each group of similar photos of an Atlas product.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/atlas-import/create:
    post:
      tags: [atlas-import]
      operationId: createAtlasWine
      summary: Create a wine with no main photo from an Atlas product.
      description: >-
        The body holds the fields of the form Add wine with no image, `url`, and
        `media_ids`. Each photo becomes an additional photo. The answer has the form of
        `POST /api/wine`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, media_ids, slug, name, producer, category, color, region]
              properties:
                url: { type: string }
                media_ids: { type: array, items: { type: integer } }
                slug: { type: string }
                name: { type: string }
                producer: { type: string }
                beverage_type_code: { type: [string, "null"] }
                category: { type: string }
                color: { type: string }
                region: { type: string }
                grapes: { type: string }
                description: { type: string }
                sweetness: { type: string, enum: ["", dry, semi_dry, semi_sweet, sweet, brut, extra_brut, brut_nature, extra_dry] }
                vintage: { type: string }
                check_duplicates: { type: boolean }
                duplicate_acknowledgement: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/atlas-import/add:
    post:
      tags: [atlas-import]
      operationId: addAtlasPhotos
      summary: Add the photos of an Atlas product to an existing wine.
      description: >-
        The button `load photos` of an Atlas product of a card. It runs no Atlas step. Each
        photo becomes an additional photo. The main photo and the patch do not change. A
        photo that the wine has already is not added again. The answer holds the new record
        and `added`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, url, media_ids]
              properties:
                slug: { type: string }
                url: { type: string }
                media_ids: { type: array, items: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import:
    get:
      tags: [website-import]
      operationId: getWebsiteImportState
      summary: Read the newest website-import job and run.
      description: >-
        The object also holds the boolean `compare_enabled`, the value of
        `import_website.COMPARE_ENABLED`. It is false since 2026-09-29, and the dialog then
        hides its button.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import/start:
    post:
      tags: [website-import]
      operationId: startWebsiteImportCompare
      summary: Compare the catalogue and optionally apply verified automatic updates.
      description: >-
        An omitted body starts a read-only comparison. With automatic true, valid new
        wines and verified image improvements are applied. Other changes stay pending.
        A disabled compare answers 403 and starts no process.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [automatic]
              properties:
                automatic: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/Object" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import/stop:
    post:
      tags: [website-import]
      operationId: stopWebsiteImport
      summary: Send SIGTERM to the current website-import job.
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import/{run}/diff:
    get:
      tags: [website-import]
      operationId: getWebsiteImportDiff
      summary: Read the prepared diff and possible renames of one run.
      parameters:
        - $ref: "#/components/parameters/WebsiteRun"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import/{run}/automate:
    post:
      tags: [website-import]
      operationId: automateWebsiteImport
      summary: Check prepared images and apply valid new wines and approved improvements.
      description: >-
        The server reads the prepared run. The client supplies no review decisions.
        A stale catalogue snapshot stops the operation before model requests or writes.
        Warnings and unresolved changes remain available for manual review.
      parameters:
        - $ref: "#/components/parameters/WebsiteRun"
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import/{run}/apply:
    post:
      tags: [website-import]
      operationId: applyWebsiteImport
      summary: Store review choices and start the apply job.
      description: >-
        Conflict values are database, website, or skip. Skip defers one change without
        a persistent refusal or acknowledgement of that source value.
      parameters:
        - $ref: "#/components/parameters/WebsiteRun"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/recognize:
    get:
      tags: [recognize]
      operationId: listRecognitionPipelines
      summary: Read the embedding pipelines available for interactive recognition.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [recognize]
      operationId: recognizeImage
      summary: Run one uploaded image through one embedding pipeline.
      parameters:
        - name: pipeline
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/FileName"
      requestBody:
        $ref: "#/components/requestBodies/Image"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Read lab, database, watcher, job, and dependency status.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/health/check:
    post:
      tags: [health]
      operationId: checkHealthEndpoint
      summary: Check one configured endpoint without loading an idle gateway model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthCheck" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    SlugQuery:
      name: slug
      in: query
      required: true
      schema: { type: string }
    Sha256:
      name: sha256
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    Sha256Query:
      name: sha256
      in: query
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    Name:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
    FileName:
      name: name
      in: query
      required: false
      schema: { type: string }
    FileNameRequired:
      name: name
      in: query
      required: true
      schema: { type: string }
    Extension:
      name: extension
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-z]+$" }
    ProductUuid:
      name: product_uuid
      in: query
      required: true
      schema: { type: string, format: uuid }
    IdQuery:
      name: id
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    SetQuery:
      name: set
      in: query
      required: true
      schema: { type: string }
    PlaceQuery:
      name: place
      in: query
      required: true
      schema: { type: string }
    RunIdQuery:
      name: id
      in: query
      required: true
      schema: { type: string }
    QueryId:
      name: query
      in: query
      required: true
      schema: { type: string }
    WebsiteRun:
      name: run
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]{8}T[0-9]{6}$" }

  requestBodies:
    Image:
      required: true
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
    TestsetPhotoWrite:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TestsetPhotoWrite" }

  responses:
    Object:
      description: JSON object.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Html:
      description: HTML page.
      content:
        text/html:
          schema: { type: string }
    Text:
      description: Plain text.
      content:
        text/plain:
          schema: { type: string }
    Yaml:
      description: OpenAPI YAML document.
      content:
        application/yaml:
          schema: { type: string }
    Image:
      description: Image bytes.
      content:
        image/jpeg:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
        application/octet-stream:
          schema: { type: string, format: binary }
    Redirect:
      description: Redirect to `/dataset`.
      headers:
        Location:
          schema: { type: string, const: /dataset }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }

    WineDraft:
      type: object
      properties:
        name: { type: string, maxLength: 4000 }
        producer: { type: string, maxLength: 4000 }
        beverage_type_code: { type: string, enum: ["", "4", "44"] }
        category: { type: string, maxLength: 4000 }
        region: { type: string, maxLength: 4000 }
        grapes: { type: string, maxLength: 4000 }
        sweetness: { type: string, enum: ["", dry, semi_dry, semi_sweet, sweet, brut, extra_brut, brut_nature, extra_dry] }
        vintage: { type: string }

    WineCreate:
      type: object
      additionalProperties: false
      required: [slug, name, producer, category, color, region, image_name, image]
      properties:
        slug: { type: string, pattern: "^__[a-z0-9][a-z0-9_-]*$" }
        name: { type: string }
        producer: { type: string }
        beverage_type_code:
          type: [string, "null"]
          enum: ["4", "44", null]
          description: "Wine category: 4 is wine and 44 is sparkling wine."
        category: { type: string }
        color: { type: string }
        region: { type: string }
        grapes: { type: string }
        description: { type: string }
        sweetness:
          type: string
          enum: ["", dry, semi_dry, semi_sweet, sweet, brut, extra_brut, brut_nature, extra_dry]
        vintage: { type: string, description: "Harvest year as four digits, or empty." }
        check_duplicates: { type: boolean, description: "Recheck duplicate identity in the create transaction." }
        duplicate_acknowledgement: { type: string, description: "Acknowledgement from the current draft comparison." }
        image_name: { type: string }
        image:
          type: string
          contentEncoding: base64
          description: JPEG, PNG, or WebP image bytes.

    WineStateChange:
      type: object
      additionalProperties: false
      required: [slug, action]
      properties:
        slug: { type: string }
        action: { type: string, enum: [disable, enable, remove, restore] }

    WineNameChange:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string, minLength: 1, maxLength: 500 }

    WineIndexRetry:
      type: object
      additionalProperties: false
      required: [slug]
      properties:
        slug: { type: string }

    GtinWrite:
      type: object
      additionalProperties: false
      required: [slug, gtin]
      properties:
        slug: { type: string }
        gtin: { type: string }

    QrUrlWrite:
      type: object
      additionalProperties: false
      required: [slug, url]
      properties:
        slug: { type: string }
        url: { type: string, format: uri }

    SlugSha256:
      type: object
      additionalProperties: false
      required: [slug, sha256]
      properties:
        slug: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }

    AlternativeType:
      allOf:
        - $ref: "#/components/schemas/SlugSha256"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [full_front, label_front, full_back, label_back]

    AlternativeCut:
      allOf:
        - $ref: "#/components/schemas/SlugSha256"
        - type: object
          required: [points]
          properties:
            points:
              type: array
              minItems: 3
              items:
                type: array
                prefixItems:
                  - { type: number }
                  - { type: number }
                minItems: 2
                maxItems: 2

    AtlasBinding:
      type: object
      additionalProperties: false
      required: [slug, product_uuid]
      properties:
        slug: { type: string }
        product_uuid: { type: string, format: uuid }

    WineComment:
      type: object
      additionalProperties: false
      required: [slug, text]
      properties:
        slug: { type: string }
        text: { type: string, maxLength: 4000 }
        source: { type: string, enum: [user, script], default: user }

    WineFavorite:
      type: object
      additionalProperties: false
      required: [slug, favorite]
      properties:
        slug: { type: string }
        favorite: { type: boolean }

    WineBeverageType:
      type: object
      additionalProperties: false
      required: [slug, beverage_type_code]
      properties:
        slug: { type: string }
        beverage_type_code:
          type: [string, "null"]
          enum: ["4", "44", null]

    WineRelation:
      type: object
      additionalProperties: false
      required: [slug, other]
      properties:
        slug: { type: string }
        other: { type: string }

    WineTag:
      type: object
      additionalProperties: false
      required: [slug, tag]
      properties:
        slug: { type: string }
        tag: { type: string, pattern: "^[^\\s]{1,64}$" }

    ImageDescription:
      type: object
      additionalProperties: false
      required: [sha256, values]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        values:
          type: object
          additionalProperties: true
          properties:
            generate_label: { type: [boolean, "null"] }

    LabelDescriptionWrite:
      type: object
      additionalProperties: false
      required: [sha256, description]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        description: { type: object, additionalProperties: true }

    IdBody:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: integer, minimum: 1 }

    ClusterNote:
      type: object
      additionalProperties: false
      required: [space, key, text]
      properties:
        space: { type: string, enum: [full, label, combined] }
        key: { type: string }
        text: { type: [string, "null"] }

    TestsetPhotoWrite:
      type: object
      additionalProperties: true
      required: [set, place, file]
      properties:
        set: { type: string }
        place: { type: string }
        file: { type: string }
        label: { type: [string, "null"] }
        delete: { type: boolean }
        text: { type: string }
        source: { type: string, enum: [user, script] }
        id: { type: integer, minimum: 1 }
        tag: { type: string }
        box:
          type: [array, "null"]
          prefixItems:
            - { type: number }
            - { type: number }
            - { type: number }
            - { type: number }
          minItems: 4
          maxItems: 4
        to: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }

    TestsetTransfer:
      type: object
      additionalProperties: false
      required: [set, place, file, to_set, sha256]
      properties:
        set: { type: string }
        place:
          type: string
          description: Keep this wine slug or special place in the destination.
        file: { type: string }
        to_set: { type: string, minLength: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }

    TestsetFetch:
      type: object
      additionalProperties: false
      required: [set, place, url]
      properties:
        set: { type: string }
        place: { type: string }
        url: { type: string, format: uri }

    TestsetFromRun:
      type: object
      additionalProperties: false
      required: [run, misses, name]
      properties:
        run: { type: string }
        misses: { type: string, enum: [r1, r5] }
        name: { type: string }

    NameBody:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }

    TestsetRename:
      type: object
      additionalProperties: false
      required: [set, name]
      properties:
        set: { type: string }
        name: { type: string }

    RunJobStart:
      type: object
      additionalProperties: false
      properties:
        configuration: { type: string }
        set: { type: string }
        selftest: { type: string }
        limit: { type: [integer, "null"], minimum: 1 }
        workers: { type: integer, minimum: 1, maximum: 32 }
        use_cache: { type: boolean }
        use_barcode: { type: boolean }
        device_ip: { type: string, format: ipv4 }
        endpoint:
          type: string
          format: uri
          description: Optional HTTP(S) origin for a pipeline with endpoint_override enabled.
        repeat_failed: { type: boolean, description: "Plan 96: repeat the failed and the new photos of the last run." }
        drawer_only: { type: boolean, description: "Match current Drawer photos as unlabelled review suggestions." }
      oneOf:
        - required: [configuration, set]
        - required: [selftest]

    HealthCheck:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [vlm, embedding, sam3, remote] }
        name: { type: string }
