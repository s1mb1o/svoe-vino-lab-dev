openapi: 3.1.0

info:
  title: Svoe Vino lab API
  version: "1.0.0"
  summary: The HTTP contract of pipeline/lab_server.py.
  description: |
    This document describes the local Svoe Vino laboratory on port 8168.
    The server reads and writes the laboratory catalogue, embedding artifacts, test
    sets, and run artifacts. It has no authentication. Keep it on a trusted local host.

    JSON write operations use UTF-8. Image upload operations send raw image bytes.
    `HEAD` has the same status and headers as `GET` for every documented GET route.
  license:
    name: Not stated
    identifier: LicenseRef-not-stated

servers:
  - url: http://127.0.0.1:8168
    description: Local lab server. The port comes from `--port`; the default is 8168.

tags:
  - name: documentation
    description: OpenAPI files and Swagger UI.
  - name: pages
    description: Browser pages of the lab.
  - name: dataset
    description: Catalogue records and manual wine edits.
  - name: descriptions
    description: Image and label descriptions.
  - name: embeddings
    description: Embedding indexes and build jobs.
  - name: clusters
    description: Embedding clusters and cluster notes.
  - name: testsets
    description: Test sets, photos, labels, comments, tags, boxes, and moves.
  - name: runs
    description: Saved run artifacts and run jobs.
  - name: website-import
    description: Catalogue comparison with vino-svoe.ru.
  - name: recognize
    description: Interactive recognition with an embedding pipeline.
  - name: health
    description: Lab status and endpoint checks.
  - name: images
    description: Stored and prepared image files.

paths:
  /:
    get:
      tags: [pages]
      operationId: redirectToDataset
      summary: Redirect to the Dataset page.
      responses:
        "302": { $ref: "#/components/responses/Redirect" }

  /docs:
    get:
      tags: [documentation]
      operationId: showSwaggerUi
      summary: Show this document with Swagger UI.
      responses:
        "200": { $ref: "#/components/responses/Html" }
        default: { $ref: "#/components/responses/Error" }

  /openapi.yaml:
    get:
      tags: [documentation]
      operationId: getOpenApiYaml
      summary: Read the checked-in OpenAPI document as YAML.
      responses:
        "200": { $ref: "#/components/responses/Yaml" }
        default: { $ref: "#/components/responses/Error" }

  /openapi.json:
    get:
      tags: [documentation]
      operationId: getOpenApiJson
      summary: Read the checked-in OpenAPI document as JSON.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /dataset:
    get:
      tags: [pages]
      operationId: showDatasetPage
      summary: Show the Dataset page.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /dataset/{slug}:
    get:
      tags: [pages]
      operationId: showDatasetWinePreview
      summary: Show the Dataset page with one wine selected.
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200": { $ref: "#/components/responses/Html" }
        default: { $ref: "#/components/responses/Error" }

  /dataset/{slug}/patch:
    get:
      tags: [pages]
      operationId: showDatasetPatchPreview
      summary: Show the Dataset page with one patch selected.
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200": { $ref: "#/components/responses/Html" }
        default: { $ref: "#/components/responses/Error" }

  /dataset/{slug}/{preview}/{sha256}:
    get:
      tags: [pages]
      operationId: showDatasetImagePreview
      summary: Show an alternative-photo or description preview.
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: preview
          in: path
          required: true
          schema: { type: string, enum: [alternative, describe] }
        - $ref: "#/components/parameters/Sha256"
      responses:
        "200": { $ref: "#/components/responses/Html" }
        default: { $ref: "#/components/responses/Error" }

  /embedding:
    get:
      tags: [pages]
      operationId: showEmbeddingsPage
      summary: Show embedding configurations and build state.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /clusters:
    get:
      tags: [pages]
      operationId: showClustersPage
      summary: Show embedding clusters.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /testset:
    get:
      tags: [pages]
      operationId: showTestsetPage
      summary: Show test sets and their photos.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /runs:
    get:
      tags: [pages]
      operationId: showRunsPage
      summary: Show saved recognition runs.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /recognize:
    get:
      tags: [pages]
      operationId: showRecognizePage
      summary: Show interactive recognition.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /health:
    get:
      tags: [pages]
      operationId: showHealthPage
      summary: Show lab and dependency status.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /website-import.js:
    get:
      tags: [pages, website-import]
      operationId: getWebsiteImportScript
      summary: Read the browser script of the website-import dialog.
      responses:
        "200":
          description: JavaScript source.
          content:
            text/javascript:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /images/{folder}/{sha256}.{extension}:
    get:
      tags: [images]
      operationId: getStoredImage
      summary: Read one image from the lab image store.
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Sha256"
        - $ref: "#/components/parameters/Extension"
      responses:
        "200": { $ref: "#/components/responses/Image" }
        default: { $ref: "#/components/responses/Error" }

  /embeddings/{name}/images/{sha256}_{view}.png:
    get:
      tags: [images, embeddings]
      operationId: getPreparedEmbeddingImage
      summary: Read one prepared input of an embedding item.
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Sha256"
        - name: view
          in: path
          required: true
          schema: { type: string, enum: [full, label] }
      responses:
        "200": { $ref: "#/components/responses/Image" }
        default: { $ref: "#/components/responses/Error" }

  /website-import/{run}/images/{sha256}.{extension}:
    get:
      tags: [images, website-import]
      operationId: getWebsiteImportImage
      summary: Read one immutable website image of an import run.
      parameters:
        - $ref: "#/components/parameters/WebsiteRun"
        - $ref: "#/components/parameters/Sha256"
        - $ref: "#/components/parameters/Extension"
      responses:
        "200": { $ref: "#/components/responses/Image" }
        default: { $ref: "#/components/responses/Error" }

  /recognize/photo/{sha256}.{extension}:
    get:
      tags: [images, recognize]
      operationId: getRecognitionPhoto
      summary: Read one image uploaded for interactive recognition.
      parameters:
        - $ref: "#/components/parameters/Sha256"
        - $ref: "#/components/parameters/Extension"
      responses:
        "200": { $ref: "#/components/responses/Image" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset:
    get:
      tags: [dataset]
      operationId: getDataset
      summary: Read all catalogue records and Dataset-page metadata.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/wine:
    post:
      tags: [dataset]
      operationId: createWine
      summary: Create a manual wine and start the background update of its configured embedding index.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineCreate" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/wine-index:
    get:
      tags: [dataset]
      operationId: getWineIndexJob
      summary: Read the background index job of one new wine.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [dataset]
      operationId: retryWineIndexJob
      summary: Start the background index job of one Active wine again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineIndexRetry" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/wine-state:
    post:
      tags: [dataset]
      operationId: changeWineState
      summary: Disable, enable, remove, or restore one wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineStateChange" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/wine-name:
    post:
      tags: [dataset]
      operationId: changeWineName
      summary: Set or clear the edited name (`name_patched`) of one wine.
      description: >-
        Plan 89. The name loses its outer white space. A name equal to the catalogue
        name clears the edit. The imports keep the edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineNameChange" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-gtin:
    post:
      tags: [dataset]
      operationId: addWineGtin
      summary: Add one normalized GTIN to a wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GtinWrite" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeWineGtin
      summary: Remove one stored GTIN from a wine.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - name: gtin
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-qr-url:
    post:
      tags: [dataset]
      operationId: addWineQrUrl
      summary: Add one normalized HTTP or HTTPS QR URL to a wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QrUrlWrite" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeWineQrUrl
      summary: Remove one stored QR URL from a wine.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-patch:
    post:
      tags: [dataset]
      operationId: storeWinePatch
      summary: Store and process one patch image.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/FileName"
      requestBody:
        $ref: "#/components/requestBodies/Image"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "413": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeWinePatch
      summary: Remove the patch image of one wine.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-alternative:
    post:
      tags: [dataset]
      operationId: storeAlternativePhoto
      summary: Store and process one alternative wine photo.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/FileName"
      requestBody:
        $ref: "#/components/requestBodies/Image"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "413": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeAlternativePhoto
      summary: Remove one alternative photo.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/Sha256Query"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-alternative-type:
    post:
      tags: [dataset]
      operationId: setAlternativePhotoType
      summary: Set the matcher role of an alternative photo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlternativeType" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-alternative-cut:
    post:
      tags: [dataset]
      operationId: setAlternativeManualCut
      summary: Store a manual polygon for one alternative photo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlternativeCut" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: resetAlternativeManualCut
      summary: Remove a manual cut and process the photo again.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/Sha256Query"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-alternative-recut:
    post:
      tags: [dataset]
      operationId: recutAlternativePhoto
      summary: Process one alternative photo again without cached segmentation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlugSha256" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-atlas-binding:
    post:
      tags: [dataset]
      operationId: setAtlasBinding
      summary: Add one manual Atlas Core product binding.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtlasBinding" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeAtlasBinding
      summary: Remove one manual Atlas Core product binding.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/ProductUuid"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-atlas-binding-approve:
    post:
      tags: [dataset]
      operationId: approveAtlasBinding
      summary: Convert one automatic Atlas binding to a manual binding.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtlasBinding" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-comment:
    post:
      tags: [dataset]
      operationId: addWineComment
      summary: Add one timestamped comment to a wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineComment" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeWineComment
      summary: Remove one wine comment.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/IdQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-favorite:
    post:
      tags: [dataset]
      operationId: setWineFavorite
      summary: Mark or unmark one wine as a favorite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineFavorite" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-beverage-type:
    post:
      tags: [dataset]
      operationId: setWineBeverageType
      summary: Set or clear the Atlas beverage type of one wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineBeverageType" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-similar:
    post:
      tags: [dataset]
      operationId: addHardCase
      summary: Add a symmetric hard-case relation between two wines.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineRelation" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeHardCase
      summary: Remove a symmetric hard-case relation.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - name: other
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-tag:
    post:
      tags: [dataset]
      operationId: addWineTag
      summary: Add a normalized tag to one wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineTag" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeWineTag
      summary: Remove one wine tag.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - name: tag
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/image-description:
    post:
      tags: [descriptions]
      operationId: setImageDescription
      summary: Set the structured manual description of one image.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageDescription" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/image-description-status:
    get:
      tags: [descriptions]
      operationId: getImageDescriptionStatus
      summary: Read watcher progress and optional log lines.
      parameters:
        - name: log
          in: query
          required: false
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/image-detail-failures:
    get:
      tags: [descriptions]
      operationId: getImageDetailFailures
      summary: Read failed detail descriptions and their watcher-log lines.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/image-description-reply:
    get:
      tags: [descriptions]
      operationId: getImageDescriptionReply
      summary: Read the cached raw VLM reply of one image.
      parameters:
        - $ref: "#/components/parameters/Sha256Query"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/image-label-descriptions:
    get:
      tags: [descriptions]
      operationId: listImageLabelDescriptions
      summary: Read all label descriptions of one linked image.
      parameters:
        - $ref: "#/components/parameters/Sha256Query"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/image-label-description:
    post:
      tags: [descriptions]
      operationId: addImageLabelDescription
      summary: Add one manual label-description object.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelDescriptionWrite" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [descriptions]
      operationId: removeImageLabelDescription
      summary: Remove one label description by row id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdBody" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/embeddings:
    get:
      tags: [embeddings]
      operationId: listEmbeddings
      summary: Read every embedding configuration, item counts, and build state.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/embeddings/build-all:
    post:
      tags: [embeddings]
      operationId: buildAllEmbeddings
      summary: Start the serial queue that incrementally builds every embedding.
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/embeddings/{name}:
    get:
      tags: [embeddings]
      operationId: getEmbedding
      summary: Read all wines and item cells of one embedding.
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/embeddings/{name}/build:
    post:
      tags: [embeddings]
      operationId: startEmbeddingBuild
      summary: Start one incremental embedding build.
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/embeddings/{name}/stop:
    post:
      tags: [embeddings]
      operationId: stopEmbeddingBuild
      summary: Send SIGTERM to one running embedding build.
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/embeddings/{name}/open:
    post:
      tags: [embeddings]
      operationId: openEmbeddingDirectory
      summary: Open one embedding directory in Finder on the server host.
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/embeddings/{name}/log:
    get:
      tags: [embeddings]
      operationId: getEmbeddingBuildLog
      summary: Read the text of one embedding build log.
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "200": { $ref: "#/components/responses/Text" }
        default: { $ref: "#/components/responses/Error" }

  /api/embedding-jobs:
    get:
      tags: [embeddings]
      operationId: listEmbeddingJobs
      summary: Read build jobs and the Build All queue.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/clusters:
    get:
      tags: [clusters]
      operationId: listClusterArtifacts
      summary: Read every cluster artifact and the Build All queue.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/clusters/build-all:
    post:
      tags: [clusters]
      operationId: buildAllClusterArtifacts
      summary: Start the serial cluster-build queue.
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/clusters/{name}:
    get:
      tags: [clusters]
      operationId: getClusterArtifact
      summary: Read one complete cluster artifact and its rules.
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/clusters/{name}/build:
    post:
      tags: [clusters]
      operationId: buildClusterArtifact
      summary: Build one cluster artifact with configured thresholds.
      parameters:
        - $ref: "#/components/parameters/Name"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/clusters/{name}/note:
    post:
      tags: [clusters]
      operationId: setClusterNote
      summary: Set a cluster note and start its label-rule rebuild.
      parameters:
        - $ref: "#/components/parameters/Name"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterNote" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset:
    get:
      tags: [testsets]
      operationId: getTestset
      summary: Read one test set; default to the first set.
      parameters:
        - name: set
          in: query
          required: false
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-label:
    post:
      tags: [testsets]
      operationId: setTestPhotoLabel
      summary: Set or clear the label of one test photo.
      requestBody:
        $ref: "#/components/requestBodies/TestsetPhotoWrite"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-delete:
    post:
      tags: [testsets]
      operationId: setTestPhotoDeleted
      summary: Set or clear the deleted mark of one test photo.
      requestBody:
        $ref: "#/components/requestBodies/TestsetPhotoWrite"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-photo-comment:
    post:
      tags: [testsets]
      operationId: addTestPhotoComment
      summary: Add one comment to a test photo.
      requestBody:
        $ref: "#/components/requestBodies/TestsetPhotoWrite"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-photo-comment-remove:
    post:
      tags: [testsets]
      operationId: removeTestPhotoComment
      summary: Remove one comment from a test photo.
      requestBody:
        $ref: "#/components/requestBodies/TestsetPhotoWrite"
      responses:
        "200": { $ref: "#/components/responses/Object" }
