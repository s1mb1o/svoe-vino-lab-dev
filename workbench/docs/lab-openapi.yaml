      operationId: exportRunPredictions
      summary: Export all saved predictions as JSONL in a stable order.
      description: >-
        Each line contains query_id, image_path, image_sha256, predicted_slug, and
        latency_ms in that order. Page filters do not affect the export.
        The official-test-2026-10-01 set uses eval_photo_NNN.webp names and query IDs
        from the photo numbers. Other sets retain their saved IDs and paths.
        The export preserves saved hashes, predictions, and latency values.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
      responses:
        "200":
          description: Compact UTF-8 JSON objects, one per line, with a final newline.
          content:
            application/x-ndjson:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/run-expected:
    get:
      tags: [runs]
      operationId: exportRunExpected
      summary: Export all expected answers as prediction-format JSONL.
      description: >-
        Each line contains query_id, image_path, image_sha256, predicted_slug, and
        latency_ms in that order. predicted_slug is the saved query truth, or null for
        an expected no-match answer. A truth with more than one accepted slug gives the
        slug of the query itself. latency_ms is always 0. Page filters do not affect
        the export. The official-test-2026-10-01 set uses eval_photo_NNN.webp names and
        query IDs from the photo numbers. Other sets retain their saved IDs and paths.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
      responses:
        "200":
          description: Compact UTF-8 JSON objects, one per line, with a final newline.
          content:
            application/x-ndjson:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

