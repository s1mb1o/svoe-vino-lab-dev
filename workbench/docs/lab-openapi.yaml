      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestsetFromRun" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-new:
    post:
      tags: [testsets]
      operationId: createEmptyTestset
      summary: Create one empty test set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameBody" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/testset-rename:
    post:
      tags: [testsets]
      operationId: renameTestset
      summary: Rename one test set and keep all of its contents.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestsetRename" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: Read the head of each run and the pipeline configurations.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run:
    get:
      tags: [runs]
      operationId: getRun
      summary: Read metrics and filtered rows of one run.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
        - name: filter
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-clusters:
    get:
      tags: [runs, clusters]
      operationId: getRunClusters
      summary: Read the cluster frames of one embedding run.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-inputs:
    get:
      tags: [runs]
      operationId: getRunInputs
      summary: Read the model inputs of one run query.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-candidate:
    get:
      tags: [runs]
      operationId: getRunCandidate
      summary: Read the catalogue inputs and cosines of one candidate.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
        - $ref: "#/components/parameters/QueryId"
        - $ref: "#/components/parameters/SlugQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-steps:
    get:
      tags: [runs]
      operationId: getRunSteps
      summary: Read the recorded processing steps of one query.
      parameters:
        - $ref: "#/components/parameters/RunIdQuery"
        - $ref: "#/components/parameters/QueryId"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-configurations:
    get:
      tags: [runs]
      operationId: listRunConfigurations
      summary: Read runnable pipeline configurations for one test set.
      parameters:
        - $ref: "#/components/parameters/SetQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-jobs:
    get:
      tags: [runs]
      operationId: listRunJobs
      summary: Read the state of each run job.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [runs]
      operationId: startRunJob
      summary: Start a pipeline run or an embedding self-test.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunJobStart" }
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/run-jobs/{name}/stop:
    post:
      tags: [runs]
      operationId: stopRunJob
      summary: Send SIGTERM to one running job.
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import:
    get:
      tags: [website-import]
      operationId: getWebsiteImportState
      summary: Read the newest website-import job and run.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import/start:
    post:
      tags: [website-import]
      operationId: startWebsiteImportCompare
      summary: Start a catalogue comparison without applying changes.
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import/stop:
    post:
      tags: [website-import]
      operationId: stopWebsiteImport
      summary: Send SIGTERM to the current website-import job.
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import/{run}/diff:
    get:
      tags: [website-import]
      operationId: getWebsiteImportDiff
      summary: Read the prepared diff and possible renames of one run.
      parameters:
        - $ref: "#/components/parameters/WebsiteRun"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/website-import/{run}/apply:
    post:
      tags: [website-import]
      operationId: applyWebsiteImport
      summary: Store review choices and start the apply job.
      parameters:
        - $ref: "#/components/parameters/WebsiteRun"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/recognize:
    get:
      tags: [recognize]
      operationId: listRecognitionPipelines
      summary: Read the embedding pipelines available for interactive recognition.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [recognize]
      operationId: recognizeImage
      summary: Run one uploaded image through one embedding pipeline.
      parameters:
        - name: pipeline
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/FileName"
      requestBody:
        $ref: "#/components/requestBodies/Image"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Read lab, database, watcher, job, and dependency status.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/health/check:
    post:
      tags: [health]
      operationId: checkHealthEndpoint
      summary: Check one configured endpoint without loading an idle gateway model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthCheck" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    SlugQuery:
      name: slug
      in: query
      required: true
      schema: { type: string }
    Sha256:
      name: sha256
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    Sha256Query:
      name: sha256
      in: query
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    Name:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
    FileName:
      name: name
      in: query
      required: false
      schema: { type: string }
    FileNameRequired:
      name: name
      in: query
      required: true
      schema: { type: string }
    Extension:
      name: extension
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-z]+$" }
    ProductUuid:
      name: product_uuid
      in: query
      required: true
      schema: { type: string, format: uuid }
    IdQuery:
      name: id
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    SetQuery:
      name: set
      in: query
      required: true
      schema: { type: string }
    PlaceQuery:
      name: place
      in: query
      required: true
      schema: { type: string }
    RunIdQuery:
      name: id
      in: query
      required: true
      schema: { type: string }
    QueryId:
      name: query
      in: query
      required: true
      schema: { type: string }
    WebsiteRun:
      name: run
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]{8}T[0-9]{6}$" }

  requestBodies:
    Image:
      required: true
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
    TestsetPhotoWrite:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TestsetPhotoWrite" }

  responses:
    Object:
      description: JSON object.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Html:
      description: HTML page.
      content:
        text/html:
          schema: { type: string }
    Text:
      description: Plain text.
      content:
        text/plain:
          schema: { type: string }
    Yaml:
      description: OpenAPI YAML document.
      content:
        application/yaml:
          schema: { type: string }
    Image:
      description: Image bytes.
      content:
        image/jpeg:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }
        image/webp:
          schema: { type: string, format: binary }
        application/octet-stream:
          schema: { type: string, format: binary }
    Redirect:
      description: Redirect to `/dataset`.
      headers:
        Location:
          schema: { type: string, const: /dataset }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }

    WineCreate:
      type: object
      additionalProperties: false
      required: [slug, name, producer, category, color, region, image_name, image]
      properties:
        slug: { type: string, pattern: "^__[a-z0-9][a-z0-9_-]*$" }
        name: { type: string }
        producer: { type: string }
        beverage_type_code:
          type: [string, "null"]
          enum: ["4", "44", null]
          description: "Wine category: 4 is wine and 44 is sparkling wine."
        category: { type: string }
        color: { type: string }
        region: { type: string }
        grapes: { type: string }
        description: { type: string }
        image_name: { type: string }
        image:
          type: string
          contentEncoding: base64
          description: JPEG, PNG, or WebP image bytes.

    WineStateChange:
      type: object
      additionalProperties: false
      required: [slug, action]
      properties:
        slug: { type: string }
        action: { type: string, enum: [disable, enable, remove, restore] }

    WineNameChange:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string, minLength: 1, maxLength: 500 }

    WineIndexRetry:
      type: object
      additionalProperties: false
      required: [slug]
      properties:
        slug: { type: string }

    GtinWrite:
      type: object
      additionalProperties: false
      required: [slug, gtin]
      properties:
        slug: { type: string }
        gtin: { type: string }

    QrUrlWrite:
      type: object
      additionalProperties: false
      required: [slug, url]
      properties:
        slug: { type: string }
        url: { type: string, format: uri }

    SlugSha256:
      type: object
      additionalProperties: false
      required: [slug, sha256]
      properties:
        slug: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }

    AlternativeType:
      allOf:
        - $ref: "#/components/schemas/SlugSha256"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [full_front, label_front, full_back, label_back]

    AlternativeCut:
      allOf:
        - $ref: "#/components/schemas/SlugSha256"
        - type: object
          required: [points]
          properties:
            points:
              type: array
              minItems: 3
              items:
                type: array
                prefixItems:
                  - { type: number }
                  - { type: number }
                minItems: 2
                maxItems: 2

    AtlasBinding:
      type: object
      additionalProperties: false
      required: [slug, product_uuid]
      properties:
        slug: { type: string }
        product_uuid: { type: string, format: uuid }

    WineComment:
      type: object
      additionalProperties: false
      required: [slug, text]
      properties:
        slug: { type: string }
        text: { type: string, maxLength: 4000 }
        source: { type: string, enum: [user, script], default: user }

    WineFavorite:
      type: object
      additionalProperties: false
      required: [slug, favorite]
      properties:
        slug: { type: string }
        favorite: { type: boolean }

    WineBeverageType:
      type: object
      additionalProperties: false
      required: [slug, beverage_type_code]
      properties:
        slug: { type: string }
        beverage_type_code:
          type: [string, "null"]
          enum: ["4", "44", null]

    WineRelation:
      type: object
      additionalProperties: false
      required: [slug, other]
      properties:
        slug: { type: string }
        other: { type: string }

    WineTag:
      type: object
      additionalProperties: false
      required: [slug, tag]
      properties:
        slug: { type: string }
        tag: { type: string, pattern: "^[^\\s]{1,64}$" }

    ImageDescription:
      type: object
      additionalProperties: false
      required: [sha256, values]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        values:
          type: object
          additionalProperties: true

    LabelDescriptionWrite:
      type: object
      additionalProperties: false
      required: [sha256, description]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        description: { type: object, additionalProperties: true }

    IdBody:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: integer, minimum: 1 }

    ClusterNote:
      type: object
      additionalProperties: false
      required: [space, key, text]
      properties:
        space: { type: string, enum: [full, label, combined] }
        key: { type: string }
        text: { type: [string, "null"] }

    TestsetPhotoWrite:
      type: object
      additionalProperties: true
      required: [set, place, file]
      properties:
        set: { type: string }
        place: { type: string }
        file: { type: string }
        label: { type: [string, "null"] }
        delete: { type: boolean }
        text: { type: string }
        source: { type: string, enum: [user, script] }
        id: { type: integer, minimum: 1 }
        tag: { type: string }
        box:
          type: [array, "null"]
          prefixItems:
            - { type: number }
            - { type: number }
            - { type: number }
            - { type: number }
          minItems: 4
          maxItems: 4
        to: { type: string }

    TestsetFetch:
      type: object
      additionalProperties: false
      required: [set, place, url]
      properties:
        set: { type: string }
        place: { type: string }
        url: { type: string, format: uri }

    TestsetFromRun:
      type: object
      additionalProperties: false
      required: [run, misses, name]
      properties:
        run: { type: string }
        misses: { type: string, enum: [r1, r5] }
        name: { type: string }

    NameBody:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }

    TestsetRename:
      type: object
      additionalProperties: false
      required: [set, name]
      properties:
        set: { type: string }
        name: { type: string }

    RunJobStart:
      type: object
      additionalProperties: false
      properties:
        configuration: { type: string }
        set: { type: string }
        selftest: { type: string }
        limit: { type: [integer, "null"], minimum: 1 }
        workers: { type: integer, minimum: 1, maximum: 32 }
        use_cache: { type: boolean }
        use_barcode: { type: boolean }
        device_ip: { type: string, format: ipv4 }
      oneOf:
        - required: [configuration, set]
        - required: [selftest]

    HealthCheck:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { type: string, enum: [vlm, embedding, sam3, remote] }
        name: { type: string }
