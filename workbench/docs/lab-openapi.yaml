        - $ref: "#/components/parameters/RunIdQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [testsets, runs]
      operationId: createTestsetFromRun
