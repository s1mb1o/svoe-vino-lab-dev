openapi: 3.1.0

info:
  title: Svoe Vino lab API
  version: "1.0.0"
  summary: The HTTP contract of pipeline/lab_server.py.
  description: |
    This document describes the local Svoe Vino laboratory on port 8168.
    The server reads and writes the laboratory catalogue, embedding artifacts, test
    sets, and run artifacts. It has no authentication. Keep it on a trusted local host.

    JSON write operations use UTF-8. Image upload operations send raw image bytes.
    `HEAD` has the same status and headers as `GET` for every documented GET route.
  license:
    name: Not stated
    identifier: LicenseRef-not-stated

servers:
  - url: http://127.0.0.1:8168
    description: Local lab server. The port comes from `--port`; the default is 8168.

tags:
  - name: documentation
    description: OpenAPI files and Swagger UI.
  - name: pages
    description: Browser pages of the lab.
  - name: dataset
    description: Catalogue records and manual wine edits.
  - name: descriptions
    description: Image and label descriptions.
  - name: embeddings
    description: Embedding indexes and build jobs.
  - name: clusters
    description: Embedding clusters and cluster notes.
  - name: testsets
    description: Test sets, photos, labels, comments, tags, boxes, and moves.
  - name: runs
    description: Saved run artifacts and run jobs.
  - name: website-import
    description: Catalogue comparison with vino-svoe.ru.
  - name: atlas-import
    description: A new wine from one Drink Atlas product (plan 95).
  - name: recognize
    description: Interactive recognition with an embedding pipeline.
  - name: health
    description: Lab status and endpoint checks.
  - name: images
    description: Stored and prepared image files.

paths:
  /:
    get:
      tags: [pages]
      operationId: redirectToDataset
      summary: Redirect to the Dataset page.
      responses:
        "302": { $ref: "#/components/responses/Redirect" }

  /docs:
    get:
      tags: [documentation]
      operationId: showSwaggerUi
      summary: Show this document with Swagger UI.
      responses:
        "200": { $ref: "#/components/responses/Html" }
        default: { $ref: "#/components/responses/Error" }

  /openapi.yaml:
    get:
      tags: [documentation]
      operationId: getOpenApiYaml
      summary: Read the checked-in OpenAPI document as YAML.
      responses:
        "200": { $ref: "#/components/responses/Yaml" }
        default: { $ref: "#/components/responses/Error" }

  /openapi.json:
    get:
      tags: [documentation]
      operationId: getOpenApiJson
      summary: Read the checked-in OpenAPI document as JSON.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /dataset:
    get:
      tags: [pages]
      operationId: showDatasetPage
      summary: Show the Dataset page.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /dataset/{slug}:
    get:
      tags: [pages]
      operationId: showDatasetWinePreview
      summary: Show the Dataset page with one wine selected.
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200": { $ref: "#/components/responses/Html" }
        default: { $ref: "#/components/responses/Error" }

  /dataset/{slug}/patch:
    get:
      tags: [pages]
      operationId: showDatasetPatchPreview
      summary: Show the Dataset page with one patch selected.
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200": { $ref: "#/components/responses/Html" }
        default: { $ref: "#/components/responses/Error" }

  /dataset/{slug}/{preview}/{sha256}:
    get:
      tags: [pages]
      operationId: showDatasetImagePreview
      summary: Show an alternative-photo or description preview.
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: preview
          in: path
          required: true
          schema: { type: string, enum: [alternative, describe] }
        - $ref: "#/components/parameters/Sha256"
      responses:
        "200": { $ref: "#/components/responses/Html" }
        default: { $ref: "#/components/responses/Error" }

  /embedding:
    get:
      tags: [pages]
      operationId: showEmbeddingsPage
      summary: Show embedding configurations and build state.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /clusters:
    get:
      tags: [pages]
      operationId: showClustersPage
      summary: Show embedding clusters.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /testset:
    get:
      tags: [pages]
      operationId: showTestsetPage
      summary: Show test sets and their photos.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /runs:
    get:
      tags: [pages]
      operationId: showRunsPage
      summary: Show saved recognition runs.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /runs/charts:
    get:
      tags: [pages]
      operationId: showRunChartsPage
      summary: Compare pipeline metrics or one pipeline's run history for a testset.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /runs/compare:
    get:
      tags: [pages]
      operationId: showRunComparisonPage
      summary: Compare saved cases from two runs.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /recognize:
    get:
      tags: [pages]
      operationId: showRecognizePage
      summary: Show interactive recognition.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /health:
    get:
      tags: [pages]
      operationId: showHealthPage
      summary: Show lab and dependency status.
      responses:
        "200": { $ref: "#/components/responses/Html" }

  /atlas-import.js:
    get:
      tags: [pages, atlas-import]
      operationId: getAtlasImportScript
      summary: Read the browser script of the dialog New from Atlas.
      responses:
        "200":
          description: JavaScript source.
          content:
            text/javascript:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /website-import.js:
    get:
      tags: [pages, website-import]
      operationId: getWebsiteImportScript
      summary: Read the browser script of the website-import dialog.
      responses:
        "200":
          description: JavaScript source.
          content:
            text/javascript:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /images/{folder}/{sha256}.{extension}:
    get:
      tags: [images]
      operationId: getStoredImage
      summary: Read one image from the lab image store.
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Sha256"
        - $ref: "#/components/parameters/Extension"
      responses:
        "200": { $ref: "#/components/responses/Image" }
        default: { $ref: "#/components/responses/Error" }

  /embeddings/{name}/images/{sha256}_{view}.png:
    get:
      tags: [images, embeddings]
      operationId: getPreparedEmbeddingImage
      summary: Read one prepared input of an embedding item.
      parameters:
        - $ref: "#/components/parameters/Name"
        - $ref: "#/components/parameters/Sha256"
        - name: view
          in: path
          required: true
          schema: { type: string, enum: [full, label] }
      responses:
        "200": { $ref: "#/components/responses/Image" }
        default: { $ref: "#/components/responses/Error" }

  /website-import/{run}/images/{sha256}.{extension}:
    get:
      tags: [images, website-import]
      operationId: getWebsiteImportImage
      summary: Read one immutable website image of an import run.
      parameters:
        - $ref: "#/components/parameters/WebsiteRun"
        - $ref: "#/components/parameters/Sha256"
        - $ref: "#/components/parameters/Extension"
      responses:
        "200": { $ref: "#/components/responses/Image" }
        default: { $ref: "#/components/responses/Error" }

  /recognize/photo/{sha256}.{extension}:
    get:
      tags: [images, recognize]
      operationId: getRecognitionPhoto
      summary: Read one image uploaded for interactive recognition.
      parameters:
        - $ref: "#/components/parameters/Sha256"
        - $ref: "#/components/parameters/Extension"
      responses:
        "200": { $ref: "#/components/responses/Image" }
        default: { $ref: "#/components/responses/Error" }

  /api/local-image:
    get:
      tags: [images]
      operationId: getLocalDropImage
      summary: Read one Codex generated image that a drop from the Codex app names.
      description: >-
        A drop from the Codex desktop app carries `app://fs/@fs/<absolute path>`, which
        the browser cannot open. The server reads only a PNG, JPEG, WebP, or GIF file
        under `~/.codex*/generated_images/`, up to 20 MB. Another path answers 403.
      parameters:
        - name: address
          in: query
          required: true
          description: An `app://fs/@fs/<absolute path>` or `file://<absolute path>` address.
          schema: { type: string, maxLength: 4096 }
      responses:
        "200": { $ref: "#/components/responses/Image" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset:
    get:
      tags: [dataset]
      operationId: getDataset
      summary: Read all catalogue records and Dataset-page metadata.
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/wine-merge:
    get:
      tags: [dataset]
      operationId: previewWineMerge
      summary: Read manual wine merge counts and available destination wines.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [dataset]
      operationId: mergeManualWine
      summary: Transfer a manual wine and its testset annotations, then delete its catalogue row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, to]
              properties:
                slug: { type: string, minLength: 3, maxLength: 200, pattern: "^__[a-z0-9][a-z0-9_-]*$" }
                to: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/wine-draft-recognize:
    post:
      tags: [dataset]
      operationId: recognizeWineDraft
      summary: Read visible bottle fields without creating a catalogue card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, contentEncoding: base64 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/wine-draft-similar:
    post:
      tags: [dataset]
      operationId: findSimilarWineDrafts
      summary: Compare partial draft fields with all catalogue states.
      description: |
        Return ranked matches, complete duplicate conflicts, and an acknowledgement.
        Exact identity requires equal normalized names, known grape sets, and known
        sweetness. A differing year or one absent year has a separate relation.
        The acknowledgement binds the draft and every current conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineDraft" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/wine:
    post:
      tags: [dataset]
      operationId: createWine
      summary: Create a manual wine and start the background update of its configured embedding index.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineCreate" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/wine-index:
    get:
      tags: [dataset]
      operationId: getWineIndexJob
      summary: Read the background index job of one new wine.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [dataset]
      operationId: retryWineIndexJob
      summary: Start the background index job of one Active wine again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineIndexRetry" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/wine-state:
    post:
      tags: [dataset]
      operationId: changeWineState
      summary: Disable, enable, remove, or restore one wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineStateChange" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/wine-name:
    post:
      tags: [dataset]
      operationId: changeWineName
      summary: Set or clear the edited name (`name_patched`) of one wine.
      description: >-
        Plan 89. The name loses its outer white space. A name equal to the catalogue
        name clears the edit. The imports keep the edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineNameChange" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-gtin:
    post:
      tags: [dataset]
      operationId: addWineGtin
      summary: Add one normalized GTIN to a wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GtinWrite" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeWineGtin
      summary: Remove one stored GTIN from a wine.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - name: gtin
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-qr-url:
    post:
      tags: [dataset]
      operationId: addWineQrUrl
      summary: Add one normalized HTTP or HTTPS QR URL to a wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QrUrlWrite" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeWineQrUrl
      summary: Remove one stored QR URL from a wine.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-patch:
    post:
      tags: [dataset]
      operationId: storeWinePatch
      summary: Store and process one patch image.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/FileName"
      requestBody:
        $ref: "#/components/requestBodies/Image"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "413": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeWinePatch
      summary: Remove the patch image of one wine.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-alternative:
    post:
      tags: [dataset]
      operationId: storeAlternativePhoto
      summary: Store and process one alternative wine photo.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/FileName"
      requestBody:
        $ref: "#/components/requestBodies/Image"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "413": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeAlternativePhoto
      summary: Remove one alternative photo.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/Sha256Query"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-alternative-type:
    post:
      tags: [dataset]
      operationId: setAlternativePhotoType
      summary: Set the matcher role of an alternative photo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlternativeType" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-photo-move:
    post:
      tags: [dataset]
      operationId: moveDatasetPhoto
      summary: Move one photo between the additional photos and main or patched.
      description: >-
        One side is `additional`, the other side is `main` or `patched`. A move to main
        or to patched swaps: the old photo of that role becomes an additional photo of
        the type `full_front`. The answer holds the new record of the wine and `swapped`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, sha256, from, to]
              properties:
                slug: { type: string }
                sha256: { type: string }
                from: { type: string, enum: [additional, main, patched] }
                to: { type: string, enum: [additional, main, patched] }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-alternative-cut:
    post:
      tags: [dataset]
      operationId: setAlternativeManualCut
      summary: Store a manual polygon for one alternative photo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlternativeCut" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: resetAlternativeManualCut
      summary: Remove a manual cut and process the photo again.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/Sha256Query"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-alternative-recut:
    post:
      tags: [dataset]
      operationId: recutAlternativePhoto
      summary: Process one alternative photo again without cached segmentation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlugSha256" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-atlas-binding:
    post:
      tags: [dataset]
      operationId: setAtlasBinding
      summary: Add one manual Atlas Core product binding.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtlasBinding" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeAtlasBinding
      summary: Remove one manual Atlas Core product binding.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/ProductUuid"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-atlas-binding-approve:
    post:
      tags: [dataset]
      operationId: approveAtlasBinding
      summary: Convert one automatic Atlas binding to a manual binding.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtlasBinding" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-comment:
    post:
      tags: [dataset]
      operationId: addWineComment
      summary: Add one timestamped comment to a wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineComment" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeWineComment
      summary: Remove one wine comment.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - $ref: "#/components/parameters/IdQuery"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-favorite:
    post:
      tags: [dataset]
      operationId: setWineFavorite
      summary: Mark or unmark one wine as a favorite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineFavorite" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-beverage-type:
    post:
      tags: [dataset]
      operationId: setWineBeverageType
      summary: Set or clear the Atlas beverage type of one wine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineBeverageType" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-similar:
    post:
      tags: [dataset]
      operationId: addHardCase
      summary: Add a symmetric hard-case relation between two wines.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineRelation" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dataset]
      operationId: removeHardCase
      summary: Remove a symmetric hard-case relation.
      parameters:
        - $ref: "#/components/parameters/SlugQuery"
        - name: other
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-attributes:
    post:
      tags: [dataset]
      operationId: queueDatasetAttributes
      summary: Queue background image fact extraction or control the queue.
      description: GET Dataset never queues inference. A refresh preserves earlier observations. Pause allows current calls to finish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                scope: { type: string, enum: [missing, all], default: missing }
                action: { type: string, enum: [pause, resume, cancel] }
      responses:
        "202": { $ref: "#/components/responses/Object" }
        default: { $ref: "#/components/responses/Error" }

  /api/dataset-vintage:
    post:
      tags: [dataset]
      operationId: addVintageLink
      summary: Link the same wine across vintages, including an entry without a year.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineRelation" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
