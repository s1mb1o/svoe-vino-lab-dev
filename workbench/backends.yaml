# Match backends of `scripts/match_run.py`.
#
# One entry defines one recognizer. `--backend <id>` selects it.
# Read `docs/match-runner.md` for the meaning of every key.
#
# A backend takes one photo as multipart/form-data and answers one slug or a
# ranked list of slugs.
#
# NEVER write a token in this file. A header value "env:NAME" is read from the
# environment variable NAME at start.

backends:

  - id: organizers
    label: The contract of the jury harness
    url: http://127.0.0.1:8080/v1/eval/predict
    field: image            # the name of the multipart field that holds the image
    response: auto          # auto | slug-object | slug-array | candidates
    timeout_s: 10           # the jury harness runs curl with --max-time 10
    top_k: 1                # the contract answers Top-1 only
    workers: 1              # the jury harness sends one request at a time

  - id: official-api
    label: Official vino-svoe recognizer (the baseline to beat)
    url: https://api.vino-svoe.ru/v1/wines/search-by-photo
    field: image
    response: auto
    query: { limit: 10 }    # the query string that asks for a ranked list
    top_k: 10
    timeout_s: 40
    # How many requests this server takes at the same time. Measured on
    # 2026-09-17 from cloudzy-ams with 36 requests: at 4 at once the wall time
    # fell by 3.2x and the median latency did not rise. At 8 at once the wall
    # time fell by 4.7x, and the median latency rose by 35 percent, from 2377 ms
    # to 3198 ms, because the requests wait in a queue. No answer stated
    # throttling and no answer was refused at either rate. Read `ResearchLog.md`.
    # The value 8 buys the shorter wall time and pays the longer latency. Use
    # `--workers 4` for the rate that costs no latency, and `--workers 1` for a
    # run whose latency is compared with the jury harness.
    workers: 8
    headers: {}             # a value "env:NAME" reads the environment variable NAME

  - id: svoe-vino-matcher
    label: Our recognizer, svoe-vino-matcher
    url: http://127.0.0.1:8158/v1/eval/predict
    field: image
    response: auto
    query: { limit: 10 }    # limit>1 makes the server answer a ranked list
    top_k: 10
    timeout_s: 30
    workers: 1              # one embedding model, one request at a time
    headers: {}

  - id: svm-gateway-siglip2
    label: svoe-vino-matcher pipeline gateway-siglip2
    url: http://127.0.0.1:8158/v1/pipelines/gateway-siglip2/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  - id: svm-ensemble-gateway-only
    label: svoe-vino-matcher pipeline ensemble-gateway-only
    url: http://127.0.0.1:8158/v1/pipelines/ensemble-gateway-only/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  - id: svm-siglip2-448
    label: svoe-vino-matcher pipeline siglip2-448
    url: http://127.0.0.1:8158/v1/pipelines/siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  # The SAME model and the SAME server as `svm-siglip2-448`, answering from an
  # OLDER index. `index` names another index file of the index directory, so
  # two index versions are compared in one benchmark with no restart and no
  # second model in memory. The server refuses a file that was built by another
  # model, resize mode, background or vector width, so this cannot silently
  # compare two vector spaces.
  #
  # `siglip2-12041b8834` is the index of 2026-09-18, built BEFORE the 6 patched
  # catalogue photos existed. Against `siglip2-d3a1b76f7e` it measures what the
  # patches are worth. The file is on the gx10 host, beside the current index.
  # Read `available_indexes` of the pipeline in `GET /v1/info` for the files
  # this server actually holds; an absent file answers 404 for every photo.
  - id: svm-siglip2-448-prepatch
    label: svoe-vino-matcher pipeline siglip2-448, pre-patch index of 2026-09-18
    url: http://127.0.0.1:8158/v1/pipelines/siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10, index: siglip2-12041b8834 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  # The SAME model and the SAME server as `svm-siglip2-448`, with each backend
  # pinned to one index file. The pair holds before and after a restart of the
  # server, because neither backend depends on the index that the server owns.
  #
  # `siglip2-fa019ee3e5` is the index of 2026-09-22 17:37: the catalogue photos
  # WITH their empty border, and 15 patches. `siglip2-88f817cdf0` is the index of
  # 2026-09-23: the cropped pictures of `dataset.image_dir`, which
  # `svoe-wino-hackaton/scripts/build_cropped.py` writes. The pair measures what
  # the crop is worth.
  - id: svm-siglip2-448-bordered
    label: svoe-vino-matcher pipeline siglip2-448, index of the photos with their border (2026-09-22)
    url: http://127.0.0.1:8158/v1/pipelines/siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10, index: siglip2-fa019ee3e5 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  - id: svm-siglip2-448-cropped
    label: svoe-vino-matcher pipeline siglip2-448, index of the cropped pictures (2026-09-23)
    url: http://127.0.0.1:8158/v1/pipelines/siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10, index: siglip2-88f817cdf0 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  - id: svm-barcode-siglip2-448
    label: svoe-vino-matcher pipeline barcode-siglip2-448
    url: http://127.0.0.1:8158/v1/pipelines/barcode-siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  - id: svm-text-siglip2-448
    label: svoe-vino-matcher pipeline text-siglip2-448
    url: http://127.0.0.1:8158/v1/pipelines/text-siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  - id: svm-rerank-siglip2-448
    label: svoe-vino-matcher pipeline rerank-siglip2-448
    url: http://127.0.0.1:8158/v1/pipelines/rerank-siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  - id: svm-ocr-siglip2-448
    label: svoe-vino-matcher pipeline ocr-siglip2-448
    url: http://127.0.0.1:8158/v1/pipelines/ocr-siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  - id: svm-official-api
    label: svoe-vino-matcher pipeline official-api
    url: http://127.0.0.1:8158/v1/pipelines/official-api/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 60
    workers: 4
    headers: {}


  # The vision-language cross-encoders. They score 20 pairs for each query, so
  # one query costs seconds, not milliseconds. The timeout is generous on
  # purpose: a timeout here would be recorded as a wrong answer and would
  # understate the model. Keep `workers: 1`; the server holds one GPU model and
  # concurrent requests only queue.
  - id: svm-vlmrerank-2b-siglip2-448
    label: svoe-vino-matcher pipeline vlmrerank-2b-siglip2-448
    url: http://127.0.0.1:8158/v1/pipelines/vlmrerank-2b-siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 180
    workers: 1
    headers: {}

  - id: svm-vlmrerank-8b-siglip2-448
    label: svoe-vino-matcher pipeline vlmrerank-8b-siglip2-448
    url: http://127.0.0.1:8158/v1/pipelines/vlmrerank-8b-siglip2-448/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 300
    workers: 1
    headers: {}

  # ------------------------------------------------------- the label experiment
  #
  # These four answer from `svoe-vino-matcher/config.label.yaml` on port 8164,
  # NOT from the main config on 8158. Start that server first:
  #   cd ../../svoe-vino-matcher && SVM_PY=.venv/bin/python ./scripts/serve.sh config.label.yaml
  #
  # The three pipelines share one query photo set and differ in ONE thing: which
  # picture is embedded. `-photo` embeds the whole photo, `-label` embeds the
  # SAM3 label crop of that photo against an index of catalogue label crops, and
  # `-ensemble` sums the two. Run the three in one session to compare them.
  #
  # Fill the crop cache BEFORE the run, or every request cuts its photo again on
  # the shared gx10 service:
  #   cd ../../svoe-vino-matcher && .venv/bin/python scripts/label_crop_cache.py \
  #       --config config.label.yaml --pipeline siglip2-448-label \
  #       --photos ../../svoe-vino-testset/dataset/my/photo
  # Then set `query.cache_only: true` in `config.label.yaml`, so a missing crop
  # is reported instead of quietly answering with the whole photo.

  - id: svm-label-gw-photo
    label: label experiment, control — gateway SigLIP 2 over the whole picture
    url: http://127.0.0.1:8164/v1/pipelines/gateway-siglip2/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 60
    workers: 1
    headers: {}

  - id: svm-label-gw-label
    label: label experiment — gateway SigLIP 2 over the SAM3 label crop
    url: http://127.0.0.1:8164/v1/pipelines/gateway-siglip2-label/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    # A cached crop answers in milliseconds. An uncached crop waits for the
    # shared SAM3 service, which took 2.2 s per call under load on 2026-09-22.
    timeout_s: 180
    workers: 1
    headers: {}

  - id: svm-label-gw-ensemble
    label: label experiment — gateway whole picture plus label crop, equal weights
    url: http://127.0.0.1:8164/v1/pipelines/ensemble-gateway-photo-label/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 180
    workers: 1
    headers: {}

  # The hard cases of 2026-09-23: the ensemble above, re-ranked inside one
  # producer by the words that separate its cards. Plan
  # `svoe-vino-matcher/docs/plans/02_sibling-difference-rerank.md`. The OCR text
  # comes from the cache alone (`cache_only: true`), so a photo that is not in
  # the cache keeps the base order.
  - id: svm-label-gw-difference
    label: hard cases — the gateway ensemble, re-ranked inside one producer by the difference words
    url: http://127.0.0.1:8164/v1/pipelines/difference-ensemble-gateway-photo-label/predict
    field: image
    response: auto
    query: { limit: 10 }
    top_k: 10
    timeout_s: 180
    workers: 1
    headers: {}

  # The cluster rule re-rank of 2026-09-23. The base is `svm-label-gw-difference`.
  # When the rank-1 card and another card of its catalogue cluster stand in the
  # first 5 positions, the VLM `qwen3.5-9b` reads the label crop with the rule of
  # that cluster. `explain: 1` keeps the answers and the scores of the rule in
  # results.jsonl, so `scripts/cluster_rules_report.py` can replay them. The VLM
  # slot is shared, so the backend takes one request at a time. Read
  # `docs/plans/05_cluster-label-rules.md`.
  - id: svm-label-gw-cluster-rules
    label: hard cases — the difference words, then the VLM rule of the catalogue cluster
    url: http://127.0.0.1:8164/v1/pipelines/cluster-rules-difference-gateway/predict
    field: image
    response: auto
    query: { limit: 10, explain: 1 }
    top_k: 10
    timeout_s: 300
    workers: 1
    headers: {}

  # The crop A/B of 2026-09-23. Each pipeline runs twice with the SAME backend
  # settings. `bordered` asks the temporary server on 8165, which reads the
  # catalogue photos with their border (`photo_dir` + `patch_dir`, 15 patches).
  # `cropped` asks the live server on 8158, which reads `dataset.image_dir`. The
  # server on 8165 runs on gx10 and is reached through an SSH tunnel; it is
  # stopped after the A/B, so the `bordered` entries answer nothing later.

  - id: svm-crop-ab-bordered-siglip2-336
