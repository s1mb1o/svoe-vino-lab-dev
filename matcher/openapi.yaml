openapi: 3.1.0
info:
  title: Svoe Vino Matcher API
  description: Identify one wine from one uploaded package or label image.
  version: 1.0.0
paths:
  /healthz:
    get:
      tags:
        - service
      summary: Check service readiness
      description: Return readiness and the selected pipeline.
      operationId: healthz
      responses:
        '200':
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/eval/predict:
    post:
      tags:
        - evaluation
      summary: Predict one wine
      description: 'Upload one JPEG, PNG, or WEBP image in the multipart field `image`.
        The endpoint requires `Authorization: Bearer <token>` when `matcher.token`
        is configured.'
      operationId: predict_image
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_predict_image'
        required: true
      responses:
        '200':
          description: The Top-1 catalogue match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
        '400':
          description: The uploaded image is empty.
        '413':
          description: The uploaded image exceeds the configured size limit.
        '401':
          description: The bearer token is missing or invalid.
        '408':
          description: The request upload exceeded its time limit.
        '415':
          description: The uploaded image format is not supported.
        '503':
          description: The matcher request queue is full.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - {}
      - BearerAuth: []
  /v1/match:
    post:
      tags:
        - match
      summary: Match one wine
      description: 'Upload one JPEG, PNG, or WEBP image in the multipart field `image`.
        The answer holds up to `k` ranked candidates with their catalogue cards. The
        endpoint requires `Authorization: Bearer <token>` when `matcher.token` is
        configured.'
      operationId: match_image
      parameters:
        - name: k
          in: query
          required: false
          schema:
            type: integer
            maximum: 20
            minimum: 1
            description: Maximum number of candidates.
            default: 20
            title: K
          description: Maximum number of candidates.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_match_image'
      responses:
        '200':
          description: The ranked catalogue candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResult'
        '400':
          description: The uploaded image is empty.
        '413':
          description: The uploaded image exceeds the configured size limit.
        '401':
          description: The bearer token is missing or invalid.
        '408':
          description: The request upload exceeded its time limit.
        '415':
          description: The uploaded image format is not supported.
        '503':
          description: The matcher request queue is full, or the selected pipeline
            has no wine cards.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - {}
      - BearerAuth: []
components:
  schemas:
    Body_match_image:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
          description: Wine package or label image.
      type: object
      required:
        - image
      title: Body_match_image
    Body_predict_image:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
          description: Wine package or label image.
      type: object
      required:
        - image
      title: Body_predict_image
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        pipeline:
          type: string
          title: Pipeline
      additionalProperties: false
      type: object
      required:
        - pipeline
      title: Health
      description: Service readiness and selected matcher pipeline.
    MatchCandidate:
      properties:
        rank:
          type: integer
          title: Rank
          description: Rank of the candidate. Rank 1 is the best match.
        slug:
          type: string
          title: Slug
          description: Catalogue slug of the wine.
        score:
          type: number
          title: Score
          description: Pipeline score. The score does not increase from one rank to
            the next.
        wine:
          $ref: '#/components/schemas/WineCard'
      additionalProperties: false
      type: object
      required:
        - rank
        - slug
        - score
        - wine
      title: MatchCandidate
      description: One ranked catalogue candidate.
    MatchResult:
      properties:
        pipeline:
          type: string
          title: Pipeline
          description: Name of the selected pipeline.
        latency_ms:
          type: number
          title: Latency Ms
          description: Processing time of the request in milliseconds.
        candidates:
          items:
            $ref: '#/components/schemas/MatchCandidate'
          type: array
          title: Candidates
          description: Up to k candidates, the best first. An empty list means no
            match.
      additionalProperties: false
      type: object
      required:
        - pipeline
        - latency_ms
        - candidates
      title: MatchResult
      description: Ranked catalogue candidates of one image.
    Prediction:
      properties:
        slug:
          type: string
          title: Slug
          description: Catalogue slug of the Top-1 match, or an empty string if no match exists.
          examples:
            - massandra-muskatel-belyy-belye-sorta-vinograda-beloe-sladkoe-16
      additionalProperties: false
      type: object
      required:
        - slug
      title: Prediction
      description: Top-1 catalogue match returned by the API.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WineCard:
      properties:
        name:
          type: string
          title: Name
          description: Wine name.
        page_url:
          type: string
          title: Page Url
          description: Catalogue page of the wine.
        producer:
          anyOf:
            - type: string
            - type: 'null'
          title: Producer
          description: Producer.
        category:
          anyOf:
            - type: string
            - type: 'null'
          title: Category
          description: Catalogue category.
        region:
          anyOf:
            - type: string
            - type: 'null'
          title: Region
          description: Region.
        color:
          anyOf:
            - type: string
            - type: 'null'
          title: Color
          description: Colour.
        grapes:
          anyOf:
            - type: string
            - type: 'null'
          title: Grapes
          description: Grape varieties.
        sugar:
          anyOf:
            - type: string
            - type: 'null'
          title: Sugar
          description: Sugar class that the slug or the name states, or null.
        image_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Image Url
          description: Official catalogue image, or null.
        qr_urls:
          items:
            type: string
          type: array
          title: Qr Urls
          description: Normalized QR code URLs of the wine.
      additionalProperties: false
      type: object
      required:
        - name
        - page_url
        - producer
        - category
        - region
        - color
        - grapes
        - sugar
        - image_url
        - qr_urls
      title: WineCard
      description: The catalogue card of one wine from the matcher bundle.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Required only when matcher.token is configured.
tags:
  - name: evaluation
    description: Official matcher evaluation contract.
  - name: match
    description: Ranked wine candidates with catalogue cards.
  - name: service
    description: Service readiness.
