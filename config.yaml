# Configuration of the svoe-vino testset builder.
# The scripts read this file through `scripts/common.py`.
#
# The file holds two parts. The keys at the top are the same for every dataset.
# The key `dataset` holds one entry per photo set, and each entry holds the files
# and the directories of that photo set alone.
#
# `scripts/review_server.py` and `scripts/match_run.py` take `--dataset <name>`.
# Without that option they use the dataset named `default`. Every other script
# uses `default` too.

# Root directory of the workspace.
# Every relative path in this file is resolved against this directory.
# An absolute path in this file stays as it is.
rootdir: /Volumes/T7_2TB/Projects-T7_2TB/drink-atlas-workspace

# Database file of the vino-svoe.ru wines.
database_file: data/lab.sqlite3

