[project]
name = "svoe-vino-model-bootstrap"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "qrcode==8.2",
  "sentencepiece==0.2.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==5.3.0",
  "uvicorn==0.54.0",
  "zxing-cpp==3.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

