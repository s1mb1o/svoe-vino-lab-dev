name: ChtoZaVino
options:
  bundleIdPrefix: chtozavino.alolalab.com
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  ChtoZaVino:
    type: application
    platform: iOS
    sources:
      - path: ChtoZaVino
        excludes:
          - Resources
      - path: ChtoZaVino/Resources/Assets.xcassets
      - path: ChtoZaVino/Resources/CompiledModels/DIS.mlmodelc
        type: folder
        buildPhase: resources
      - path: ChtoZaVino/Resources/CompiledModels/SigLIP2ImageEncoder.mlmodelc
        type: folder
        buildPhase: resources
      - path: ChtoZaVino/Resources/CompiledModels/SigLIP2BaseNaFlexP512ImageEncoder.mlmodelc
        type: folder
        buildPhase: resources
      - path: ChtoZaVino/Resources/CompiledModels/MobileCLIP2S2ImageEncoder.mlmodelc
        type: folder
        buildPhase: resources
      - path: ChtoZaVino/Resources/CompiledModels/YOLO26nSeg.mlmodelc
        type: folder
        buildPhase: resources
      - path: ChtoZaVino/Resources/BuiltinPack
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chtozavino.alolalab.com
        PRODUCT_NAME: ChtoZaVino
        PRODUCT_MODULE_NAME: ChtoZaVino
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Что за вино?"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна для фотографии бутылки и сканирования кода."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Фототека нужна для выбора фотографии бутылки."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Локальная сеть нужна только для debug HTTP API."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - ChtoZaVinoTests
        - ChtoZaVinoUITests
  ChtoZaVinoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChtoZaVinoTests
    dependencies:
      - target: ChtoZaVino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chtozavino.alolalab.com.tests
        GENERATE_INFOPLIST_FILE: YES
  ChtoZaVinoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChtoZaVinoUITests
    dependencies:
      - target: ChtoZaVino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chtozavino.alolalab.com.ui-tests
        GENERATE_INFOPLIST_FILE: YES
