[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svoe-vino-dinner-lens"
version = "0.4.0"
description = "Deterministic food-to-wine filtering, curated selection and semantic continuation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "fastapi>=0.115", "uvicorn>=0.30", "pillow>=10"]

[project.optional-dependencies]
test = ["httpx>=0.27", "jsonschema>=4.23"]

[project.scripts]
dinner-lens = "dinner_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/svoe-vino-dinner-lens/data" = ["data/pairing-dataset.v1.json", "data/pairing-dataset.v2.json", "data/pairing-dataset.v3.json", "data/pairing-dataset.v4.json", "data/pairing-dataset.schema.json", "data/pairing-dataset.v3.schema.json", "data/pairing-dataset.v4.schema.json", "data/pairing-dataset.validation.json", "data/pairing-dataset.v3.validation.json", "data/pairing-dataset.v4.validation.json"]
"share/svoe-vino-dinner-lens/prompts" = ["prompts/image-system.en.txt", "prompts/style-guidance.en.json", "prompts/style-guidance.v2.en.json"]
