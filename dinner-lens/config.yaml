# Public service settings. Secret values MUST be environment variables.
# Relative paths resolve from this file. bundle: paths use installed reference assets.
server:
  host: 127.0.0.1
  port: 8176
  workers: 1
  log_level: info
  access_log: true
assets:
  dataset: bundle:data/pairing-dataset.v4.json
  index: null  # Checkout data/index.v4; installed wheel ~/.cache/svoe-vino-dinner-lens/index.v4.
  style: bundle:prompts/style-guidance.v2.en.json
auth:
  api_token_env: DINNER_LENS_API_TOKEN
  cursor_secret_env: DINNER_LENS_CURSOR_SECRET
limits:
  max_request_bytes: 8388608
  recognition_concurrency: 4
  recognition_queue_seconds: 1.0
  cursor_ttl_seconds: 3600
recognition:
  endpoint: https://maas.qwencloudapi.com/compatible-mode/v1/chat/completions
  model: qwen3.8-flash
  prompt: bundle:prompts/image-system.en.txt
  api_key_env: QWENCLOUD_PAYGO_API_KEY
  socket_timeout_seconds: 20.0
  budget_seconds: 50.0
  attempts: 3
  max_response_bytes: 1048576
  max_tokens: 768
  temperature: 0.0
  enable_thinking: false
  image:
    max_bytes: 5242880
    max_pixels: 20000000
    max_side: 2048
embeddings:
  endpoint: https://maas.qwencloudapi.com/compatible-mode/v1/embeddings
  model: qwen3.7-text-embedding
  dimensions: 1024
  api_key_env: QWENCLOUD_PAYGO_API_KEY
  socket_timeout_seconds: 60.0
  attempts: 3
  workers: 4
